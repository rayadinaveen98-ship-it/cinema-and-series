name: Data Foundation V2 — External Evidence + Current Row Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/foundation-external-preflight.yml"
      - "data/review/foundation-v2-external-evidence-20.json"
      - "scripts/foundation_external_preflight.py"
      - "tests/test_foundation_external_preflight.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cinema-foundation-current-row-preflight
  cancel-in-progress: false

jobs:
  readonly-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Confirm Data Foundation freeze remains in force
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker=json.loads(Path("ops/data-foundation-v2-freeze.json").read_text())
          assert marker["active"] is True
          PY
      - name: Test evidence and read-only preflight logic
        run: python -m unittest tests.test_foundation_external_preflight -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bind D1 without migrations or writes
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py
      - name: Restore existing 20-film dry-run artifact
        uses: actions/download-artifact@v4
        with:
          name: data-foundation-v2-20-film-review-packet
          run-id: 39764251711
          github-token: ${{ github.token }}
          path: data/generated/foundation-external
      - name: Build a single bounded SELECT of 20 exact existing QIDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("data/generated/foundation-external")
          packet=json.loads((root/"batch20-review.json").read_text(encoding="utf-8"))
          assert packet["batch_size"]==20 and not packet["ready_for_production_write"]
          ids=[item["before"]["wikidata_qid"] for item in packet["items"]]
          assert len(ids)==len(set(ids))==20
          assert all(re.fullmatch(r"Q[1-9][0-9]*",qid) for qid in ids)
          clause=", ".join("'"+qid+"'" for qid in ids)
          statement=("SELECT id,wikidata_qid,title,release_year,language_name,country_code "
                     "FROM catalogue_titles WHERE wikidata_qid IN ("+clause+") "
                     "ORDER BY wikidata_qid;")
          assert statement.startswith("SELECT ") and ";" not in statement[:-1]
          (root/"read-only-20.sql").write_text(statement+"\n",encoding="utf-8")
          print("Read-only exact 20-QID SELECT prepared",flush=True)
          PY
      - name: Execute exactly one production D1 SELECT, never write
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/foundation-external
          QUERY="$(cat "$ROOT/read-only-20.sql")"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "$QUERY" > "$ROOT/current20.json"
      - name: Cross-check frozen values, independent sources and current D1
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/foundation-external
          python scripts/foundation_external_preflight.py \
            --packet "$ROOT/batch20-review.json" \
            --evidence data/review/foundation-v2-external-evidence-20.json \
            --current "$ROOT/current20.json" \
            --out "$ROOT/checked20.json" \
            --csv "$ROOT/checked20.csv"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path("data/generated/foundation-external/checked20.json").read_text())
          assert report["preflight_existing_titles"]==20
          assert report["d1_writes"]==0 and not report["sql_generated"]
          assert report["automatically_approved"]==0 and not report["production_write_authorized"]
          # Three independently disputed identity/year cases MUST remain held.
          held={r["qid"] for r in report["results"] if r["status"]=="HOLD"}
          assert {"Q20967570","Q109519684","Q20649744"}<=held
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Data Foundation V2 — independently sourced 20-title production preflight\n\n")
              f.write("- Exactly one narrow D1 SELECT; **no updates or migrations**.\n")
              f.write(f"- External-evidence cases with current preconditions matching (review-only): **{report['review_candidates']}**\n")
              f.write(f"- Held (year/identity conflicts or current database drift): **{report['held']}**\n")
              f.write("- **Production updates approved: 0**. No write SQL generated.\n\n")
              f.write("Conflicting sources: Asurakulam source year, Saadey CM Saab actual 2016, and weakly disambiguated Mr. Romeo 2021.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-foundation-v2-20-external-current-review
          path: |
            data/generated/foundation-external/checked20.json
            data/generated/foundation-external/checked20.csv
          if-no-files-found: warn
          retention-days: 30
