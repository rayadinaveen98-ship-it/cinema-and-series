name: India Pilot — Cross-Type Collision Diagnosis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/india-pilot-collision-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Connect to existing D1
        run: |
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Query exact colliding QIDs and titles (read-only)
        run: |
          mkdir -p data/generated/india-diagnosis
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT c.id AS movie_id, c.wikidata_qid AS qid, c.title AS movie_title, c.source_category AS movie_category, s.id AS series_id, s.title AS series_title FROM catalogue_titles c JOIN series_titles s ON c.wikidata_qid=s.wikidata_qid ORDER BY c.wikidata_qid;" \
            > data/generated/india-diagnosis/collisions.json

      - name: Download exact batch submitted by import workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38851272139 --repo "$GITHUB_REPOSITORY" \
            --name india-100-movie-production-pilot \
            --dir data/generated/india-diagnosis/pilot
          test -s data/generated/india-diagnosis/pilot/import-plan.json

      - name: Determine if any collision QID was in this import pilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("data/generated/india-diagnosis")
          collisions = json.loads((folder/"collisions.json").read_text())
          conflicts = collisions[0]["results"]
          plan = json.loads((folder/"pilot/import-plan.json").read_text())
          imported = {row["wikidata_qid"] for row in plan["selected"]}
          summary = {
              "cross_type_collision_count": len(conflicts),
              "collisions": [{**row, "was_in_pilot_batch": row["qid"] in imported} for row in conflicts],
          }
          print("INDIA_COLLISION_DIAGNOSIS=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))
          (folder/"report.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Indian Movie Import: Cross-Type Collision Diagnosis\n\n")
              out.write(f"Collisions: {len(conflicts)}\n\n")
              out.write("Colliding IDs present in imported 100-title batch: "
                        f"{sum(row['qid'] in imported for row in conflicts)}\n")
          if any(row["qid"] in imported for row in conflicts):
              raise SystemExit("Critical: pilot added a colliding movie identity. Requires correction.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-movie-pilot-collision-diagnosis
          path: data/generated/india-diagnosis/report.json
          if-no-files-found: warn
          retention-days: 30
