name: Android APK — Phase 2 Final

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Cinema-and-Series-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-and-Series-v1.0.0
          path: Cinema-and-Series-v1.0.0.apk
          retention-days: 30

      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="p2-final-apk-${{ github.run_number }}"
          gh release create "$TAG" "Cinema-and-Series-v1.0.0.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cinema & Series Phase 2 Final APK $TAG" \
            --notes "Phase 2 final APK built from commit $GITHUB_SHA. Artwork remains fail-closed where rights-qualified production assets are unavailable."
