name: P1 Final Completion Attestation

on:
  workflow_dispatch:
    inputs:
      trigger_run_id:
        description: "Successful main Recommendation Metadata Production Write V3 run to attest"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: p1-final-completion-attestation-${{ inputs.trigger_run_id }}
  cancel-in-progress: false

env:
  REVIEWED_ANALYSIS_RUN_ID: "35428784454"
  REVIEWED_ARTIFACT: "recommendation-metadata-materialization-v3-repartitioned"
  FINAL_VERIFY_ARTIFACT: "recommendation-metadata-production-write-v3-verify_final-final"
  EXPECTED_ARTIFACT_ATTESTATION_SHA256: "8eb39db7964c03e968b26aeccaa33f4b0f85c422fe4c08471ee7ec95510e2986"
  EXPECTED_PROJECTION_SHA256: "f26f6218a43c843dd12bbe14e461d9b8264dc26ab06244957bcd5d5042512ff6"
  EXPECTED_GRAPH_SHA256: "9a931b9a7ef081dd8579f67218de14d086515f4cc4bfa20cacb3edb2b8379b78"
  EXPECTED_CANDIDATES: "16380"
  EXPECTED_MOVIES: "6562"
  EXPECTED_SERIES: "9818"
  EXPECTED_GENRES: "612"
  EXPECTED_PEOPLE: "37964"
  EXPECTED_GENRE_RELATIONS: "16489"
  EXPECTED_CREDIT_RELATIONS: "70551"

jobs:
  attest-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate successful main V3 triggering run
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json"             "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}"             > /tmp/p1-trigger-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path('/tmp/p1-trigger-run.json').read_text(encoding='utf-8'))
          if run.get('name') != 'Recommendation Metadata Production Write V3':
              raise SystemExit(f"unexpected triggering workflow: {run.get('name')}")
          if run.get('path') != '.github/workflows/recommendation-metadata-production-write-v3.yml':
              raise SystemExit(f"unexpected triggering workflow path: {run.get('path')}")
          if run.get('head_branch') != 'main':
              raise SystemExit(f"triggering workflow is not on main: {run.get('head_branch')}")
          if run.get('conclusion') != 'success':
              raise SystemExit(f"triggering workflow is not successful: {run.get('conclusion')}")
          print(f"P1_FINAL_ATTESTATION_TRIGGER_RUN_VERIFIED={os.environ['TRIGGER_RUN_ID']}")
          PY

      - name: Require exact final-verification artifact on triggering run
        id: final_artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts?per_page=100" \
            > /tmp/p1-final-artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path('/tmp/p1-final-artifacts.json').read_text(encoding='utf-8'))
          target=os.environ['FINAL_VERIFY_ARTIFACT']
          matches=[a for a in payload.get('artifacts') or [] if a.get('name')==target and not a.get('expired')]
          if len(matches)>1:
              raise SystemExit(f'multiple non-expired final verification artifacts found: {len(matches)}')
          found=len(matches)==1
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"is_final={'true' if found else 'false'}\n")
          print(f"P1_FINAL_ATTESTATION_TRIGGER={'final_verify' if found else 'non_final_writer'}")
          PY

      - name: Restore final verification evidence
        if: steps.final_artifact.outputs.is_final == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FINAL_VERIFY_ARTIFACT }}
          path: data/generated/final-verify-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.TRIGGER_RUN_ID }}

      - name: Restore immutable reviewed V3 attestation
        if: steps.final_artifact.outputs.is_final == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REVIEWED_ARTIFACT }}
          path: data/generated/reviewed-v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.REVIEWED_ANALYSIS_RUN_ID }}

      - name: Build fail-closed P1 completion attestation
        if: steps.final_artifact.outputs.is_final == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/p1-completion
          python scripts/build_p1_completion_attestation.py \
            --attestation data/generated/reviewed-v3/artifact-attestation-v3.json \
            --projection-manifest data/generated/final-verify-evidence/projection/manifest.json \
            --graph-verification data/generated/final-verify-evidence/final/graph-verification.json \
            --integrity-json data/generated/final-verify-evidence/integrity.json \
            --catalogue-quality data/generated/final-verify-evidence/final/catalogue-quality-v1.json \
            --source-movies data/generated/final-verify-evidence/source-movies.json \
            --source-catalogue data/generated/final-verify-evidence/source-catalogue.json \
            --source-series data/generated/final-verify-evidence/source-series.json \
            --expected-attestation-sha256 "$EXPECTED_ARTIFACT_ATTESTATION_SHA256" \
            --expected-projection-sha256 "$EXPECTED_PROJECTION_SHA256" \
            --expected-graph-sha256 "$EXPECTED_GRAPH_SHA256" \
            --expected-candidates "$EXPECTED_CANDIDATES" \
            --expected-movies "$EXPECTED_MOVIES" \
            --expected-series "$EXPECTED_SERIES" \
            --expected-genres "$EXPECTED_GENRES" \
            --expected-people "$EXPECTED_PEOPLE" \
            --expected-genre-relations "$EXPECTED_GENRE_RELATIONS" \
            --expected-credit-relations "$EXPECTED_CREDIT_RELATIONS" \
            --out data/generated/p1-completion/p1-completion-attestation.json

      - name: Publish P1 completion attestation
        if: steps.final_artifact.outputs.is_final == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1-final-completion-attestation-${{ env.TRIGGER_RUN_ID }}
          path: data/generated/p1-completion/p1-completion-attestation.json
          retention-days: 90
          if-no-files-found: error
