name: Fast Artwork — 50 Movies + 20 Series (Review Only)

# Actual existing production IDs and visual discovery, never automatically
# publishes non-free posters. Runs once when this workflow enters main.
on:
  push:
    branches: [main]
    paths: [".github/workflows/artwork-fast-70.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinema-fast-artwork-70
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test exact-identity artwork and preview-only guarantees
        run: |
          python -m unittest tests.test_artwork_fast_70 \
            tests.test_wikipedia_film_posters_pilot \
            tests.test_existing_artwork_review_gallery -v
      - name: Bind existing production database, never migrate or write
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py
          mkdir -p data/generated/artwork-fast-70

      - name: Select highest-priority missing-image titles from exact production IDs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/artwork-fast-70
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT m.id,m.wikidata_qid,m.title,
              CAST(substr(m.release_date,1,4) AS INTEGER) AS year,
              m.language_name,m.country_code
            FROM movies m
            WHERE m.country_code='IN'
              AND m.language_name IN ('Telugu','Tamil','Malayalam','Hindi','Kannada','Bengali','Marathi')
              AND m.wikidata_qid GLOB 'Q[0-9]*' AND m.title<>m.wikidata_qid
              AND COALESCE(TRIM(m.poster_url),'')=''
              AND NOT EXISTS (SELECT 1 FROM title_artwork_links l
                WHERE l.source_table='movies' AND l.source_id=m.id
                  AND l.presentation_role='poster')
            ORDER BY CASE m.language_name WHEN 'Telugu' THEN 0 WHEN 'Tamil' THEN 1
              WHEN 'Malayalam' THEN 2 WHEN 'Hindi' THEN 3 WHEN 'Kannada' THEN 4 ELSE 5 END,
              m.release_date DESC
            LIMIT 120;" > "$ROOT/movies.json"
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT c.id,c.wikidata_qid,c.title,c.release_year AS year,
              c.language_name,c.country_code
            FROM catalogue_titles c
            WHERE c.country_code='IN'
              AND c.language_name IN ('Telugu','Tamil','Malayalam','Hindi','Kannada','Bengali','Marathi')
              AND c.wikidata_qid GLOB 'Q[0-9]*'
              AND c.release_year BETWEEN 2015 AND 2026
              AND NOT EXISTS (SELECT 1 FROM movies m
                WHERE m.wikidata_qid=c.wikidata_qid AND m.title<>m.wikidata_qid)
              AND NOT EXISTS (SELECT 1 FROM title_artwork_links l
                WHERE l.source_table='catalogue_titles' AND l.source_id=c.id
                  AND l.presentation_role='poster')
            ORDER BY CASE c.language_name WHEN 'Telugu' THEN 0 WHEN 'Tamil' THEN 1
              WHEN 'Malayalam' THEN 2 WHEN 'Hindi' THEN 3 WHEN 'Kannada' THEN 4 ELSE 5 END,
              c.release_year DESC,c.title
            LIMIT 80;" > "$ROOT/catalogue_titles.json"
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT s.id,s.wikidata_qid,s.title,s.first_air_year AS year,
              s.language_name,s.country_code
            FROM series_titles s
            WHERE s.country_code='IN'
              AND s.language_name IN ('Telugu','Tamil','Malayalam','Hindi','Kannada','Bengali','Marathi')
              AND s.wikidata_qid GLOB 'Q[0-9]*'
              AND COALESCE(TRIM(s.poster_url),'')=''
              AND NOT EXISTS (SELECT 1 FROM title_artwork_links l
                WHERE l.source_table='series_titles' AND l.source_id=s.id
                  AND l.presentation_role='poster')
            ORDER BY CASE s.language_name WHEN 'Telugu' THEN 0 WHEN 'Tamil' THEN 1
              WHEN 'Malayalam' THEN 2 WHEN 'Hindi' THEN 3 WHEN 'Kannada' THEN 4 ELSE 5 END,
              COALESCE(s.first_air_year,0) DESC,s.title
            LIMIT 90;" > "$ROOT/series_titles.json"

      - name: Fetch matched film/series pageimages, separate portrait/backdrop candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/artwork-fast-70
          python scripts/artwork_fast_70.py \
            --movies "$ROOT/movies.json" \
            --catalogue-titles "$ROOT/catalogue_titles.json" \
            --series-titles "$ROOT/series_titles.json" \
            --out "$ROOT/candidates.json"
          python scripts/render_existing_artwork_review.py \
            --input "$ROOT/candidates.json" \
            --html "$ROOT/review-gallery.html" \
            --csv "$ROOT/review-decisions.csv"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("data/generated/artwork-fast-70/candidates.json")
          r=json.loads(p.read_text())
          assert r['d1_writes']==0 and r['publication_performed'] is False
          assert r['selected_count']<=70
          assert all(c['approved_for_publication'] is False
                     and c['production_written'] is False for c in r['candidates'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## Real-title fast artwork discovery (not published)\n\n')
              out.write(f"**{r['selected_count']}** existing titles selected\n\n")
              out.write(f"- Portrait poster leads: **{r['poster_candidates']}**\n")
              out.write(f"- Landscape backdrop leads: **{r['backdrop_candidates']}**\n")
              out.write(f"- Total titles with a visible candidate: **{r['visible_artwork_candidates']}**\n")
              out.write(f"- By database table: {r['selected_by_table']}\n")
              out.write(f"- Source errors: {r['source_errors']}\n\n")
              out.write('All are review-only image leads: a visual match is not publication permission.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema-fast-70-image-candidates
          path: |
            data/generated/artwork-fast-70/candidates.json
            data/generated/artwork-fast-70/review-gallery.html
            data/generated/artwork-fast-70/review-decisions.csv
          retention-days: 30
          if-no-files-found: warn
