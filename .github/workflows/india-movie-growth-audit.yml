name: India Movie Growth — Read-Only Discovery Audit

on:
  push:
    branches: [main, "feature/india-*"]
    paths:
      - "scripts/audit_indian_movie_growth.py"
      - "tests/test_indian_movie_growth_audit.py"
      - ".github/workflows/india-movie-growth-audit.yml"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Discovery start year (1913..2026)"
        required: true
        default: "2015"
      end_year:
        description: "Discovery end year (<=2026)"
        required: true
        default: "2026"
      max_candidates:
        description: "Read-only discovered article cap (up to 15000)"
        required: true
        default: "8000"
      category_offset:
        description: "Category offset to resume; 0 starts at the newest year"
        required: true
        default: "0"
      max_categories:
        description: "Maximum category seeds to scan this run (suggested 10–20)"
        required: true
        default: "20"

concurrency:
  group: india-movie-read-only-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check audit logic without network access
        run: python -m unittest tests.test_indian_movie_growth_audit -v

  read-only-discovery:
    needs: unit-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      START_YEAR: ${{ inputs.start_year || '2015' }}
      END_YEAR: ${{ inputs.end_year || '2026' }}
      MAX_CANDIDATES: ${{ inputs.max_candidates || '8000' }}
      CATEGORY_OFFSET: ${{ inputs.category_offset || '0' }}
      MAX_CATEGORIES: ${{ inputs.max_categories || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm read-only baseline access
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Read production movie identities (no writes or migrations)
        shell: bash
        run: |
          mkdir -p data/generated/india-audit
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id, wikidata_qid, title, release_date FROM movies;" \
            > data/generated/india-audit/exact-movies.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id, wikidata_qid, wikipedia_page_id, title, release_year FROM catalogue_titles;" \
            > data/generated/india-audit/year-movies.json

      - name: Run paced, resumable Indian-film discovery and dedup audit
        shell: bash
        run: |
          python scripts/audit_indian_movie_growth.py \
            --start-year "$START_YEAR" \
            --end-year "$END_YEAR" \
            --max-candidates "$MAX_CANDIDATES" \
            --category-offset "$CATEGORY_OFFSET" \
            --max-categories "$MAX_CATEGORIES" \
            --exact-movies data/generated/india-audit/exact-movies.json \
            --year-movies data/generated/india-audit/year-movies.json \
            --out-json data/generated/india-audit/india-movie-report.json \
            --out-md data/generated/india-audit/india-movie-report.md

      - name: Publish clearly labeled results
        if: always()
        shell: bash
        run: |
          if [[ -f data/generated/india-audit/india-movie-report.md ]]; then
            cat data/generated/india-audit/india-movie-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save discovery evidence, not production changes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-movie-read-only-discovery
          path: |
            data/generated/india-audit/india-movie-report.json
            data/generated/india-audit/india-movie-report.md
          retention-days: 30
          if-no-files-found: warn
