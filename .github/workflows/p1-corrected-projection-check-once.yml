name: P1 Corrected Projection Check Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-corrected-projection-check-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind production D1
        run: |
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py
      - name: Recapture corrected recommendation projection read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/p1-corrected-projection
          npx wrangler d1 execute cinema-and-series --remote --json --command "SELECT id,wikidata_qid,title FROM movies WHERE wikidata_qid IS NOT NULL AND trim(wikidata_qid) <> '' ORDER BY id;" > data/generated/p1-corrected-projection/movies.json
          npx wrangler d1 execute cinema-and-series --remote --json --command "SELECT id,wikidata_qid,title,source_url FROM catalogue_titles WHERE wikidata_qid IS NOT NULL AND trim(wikidata_qid) <> '' ORDER BY id;" > data/generated/p1-corrected-projection/catalogue.json
          npx wrangler d1 execute cinema-and-series --remote --json --command "SELECT id,wikidata_qid,title,source_url FROM series_titles WHERE wikidata_qid IS NOT NULL AND trim(wikidata_qid) <> '' ORDER BY id;" > data/generated/p1-corrected-projection/series.json
          python scripts/recommendation_projection_manifest.py \
            --movies data/generated/p1-corrected-projection/movies.json \
            --catalogue data/generated/p1-corrected-projection/catalogue.json \
            --series data/generated/p1-corrected-projection/series.json \
            --out-json data/generated/p1-corrected-projection/manifest.json
          cat data/generated/p1-corrected-projection/manifest.json | python -c "import json,sys; m=json.load(sys.stdin); print('P1_CORRECTED_PROJECTION='+json.dumps({k:m[k] for k in ('candidate_count','movie_qid_count','series_qid_count','suppressed_catalogue_overlap_count','suppressed_media_identity_correction_qids','sha256')},sort_keys=True))"
      - uses: actions/upload-artifact@v4
        with:
          name: p1-corrected-projection-${{ github.run_id }}
          path: data/generated/p1-corrected-projection/**
          retention-days: 30
