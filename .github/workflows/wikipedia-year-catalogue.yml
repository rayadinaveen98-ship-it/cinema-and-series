name: Wikipedia Year Catalogue

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_wikipedia_year_catalogue.py"
      - "tests/test_wikipedia_year_catalogue.py"
      - "migrations/0017_year_precision_catalogue.sql"
      - ".github/workflows/wikipedia-year-catalogue.yml"
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Wikipedia catalogue profile
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - india
          - global-recent
          - rotate
          - all-historical
      max_titles:
        description: Maximum titles to import this run (hard capped at 4000)
        required: true
        default: "4000"
        type: string

concurrency:
  group: wikipedia-year-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run year catalogue tests
        run: python -m unittest tests.test_wikipedia_year_catalogue -v

      - name: Choose acquisition profile
        id: profile
        shell: bash
        run: |
          profile="rotate"
          max_titles="4000"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            profile="bootstrap"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${{ github.event.inputs.profile }}"
            max_titles="${{ github.event.inputs.max_titles }}"
          fi
          if ! [[ "$max_titles" =~ ^[0-9]+$ ]]; then
            max_titles="4000"
          fi
          if (( max_titles < 1 )); then max_titles=1; fi
          if (( max_titles > 4000 )); then max_titles=4000; fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "max_titles=$max_titles" >> "$GITHUB_OUTPUT"
          echo "Wikipedia year catalogue: profile=$profile cap=$max_titles"

      - name: Acquire year-precision Wikipedia titles
        run: |
          python scripts/fetch_wikipedia_year_catalogue.py \
            --profile "${{ steps.profile.outputs.profile }}" \
            --max-titles "${{ steps.profile.outputs.max_titles }}" \
            --out data/generated/wikipedia-year-catalogue.json \
            --sql-out data/generated/wikipedia-year-catalogue-upsert.sql
          python -m json.tool data/generated/wikipedia-year-catalogue.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/generated/wikipedia-year-catalogue.json").read_text(encoding="utf-8"))
          movies = payload.get("movies") or []
          if not movies:
              raise SystemExit("Wikipedia year catalogue produced no titles")
          if len(movies) > 4000:
              raise SystemExit(f"year catalogue exceeded 4000-title safety cap: {len(movies)}")
          malformed = [
              movie for movie in movies
              if not movie.get("id")
              or not movie.get("title")
              or not isinstance(movie.get("release_year"), int)
              or movie.get("date_precision") != "year"
              or not movie.get("wikipedia_page_id")
          ]
          if malformed:
              raise SystemExit(f"malformed year catalogue rows: {malformed[:3]}")
          invented_days = [movie for movie in movies if movie.get("release_date")]
          if invented_days:
              raise SystemExit(f"year catalogue must not invent exact dates: {invented_days[:3]}")
          countries = sorted({movie.get("country_code") for movie in movies if movie.get("country_code")})
          languages = sorted({movie.get("language") for movie in movies if movie.get("language")})
          print(f"validated {len(movies)} year-precision titles across {len(countries)} country codes and {len(languages)} language labels")
          print("country sample:", countries[:30])
          print("language sample:", languages[:30])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-year-catalogue
          path: |
            data/generated/wikipedia-year-catalogue.json
            data/generated/wikipedia-year-catalogue-upsert.sql
          retention-days: 14

      - name: Check Cloudflare connection
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials unavailable; catalogue artifact retained but D1 import skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        if: steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Catalogue counts before import
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS exact_day_titles FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS year_precision_titles FROM catalogue_titles;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT (SELECT COUNT(*) FROM movies m WHERE m.wikidata_qid IS NULL OR m.title <> m.wikidata_qid) + (SELECT COUNT(*) FROM catalogue_titles ct WHERE ct.wikidata_qid IS NULL OR NOT EXISTS (SELECT 1 FROM movies mx WHERE mx.wikidata_qid=ct.wikidata_qid AND mx.title <> mx.wikidata_qid)) AS combined_catalogue_titles;"

      - name: Import year-precision catalogue
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute cinema-and-series --remote --file=data/generated/wikipedia-year-catalogue-upsert.sql

      - name: Verify production catalogue growth
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS year_precision_titles FROM catalogue_titles;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT country_code, COUNT(*) AS titles FROM catalogue_titles GROUP BY country_code ORDER BY titles DESC LIMIT 30;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT language_name, COUNT(*) AS titles FROM catalogue_titles GROUP BY language_name ORDER BY titles DESC LIMIT 20;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT (SELECT COUNT(*) FROM movies m WHERE m.wikidata_qid IS NULL OR m.title <> m.wikidata_qid) + (SELECT COUNT(*) FROM catalogue_titles ct WHERE ct.wikidata_qid IS NULL OR NOT EXISTS (SELECT 1 FROM movies mx WHERE mx.wikidata_qid=ct.wikidata_qid AND mx.title <> mx.wikidata_qid)) AS combined_catalogue_titles;"
