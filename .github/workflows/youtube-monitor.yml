name: Official YouTube Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-monitor.yml"
      - "scripts/youtube_monitor.py"
      - "scripts/filter_youtube_candidates.py"
      - "scripts/cloudflare_bootstrap.py"
      - "data/official/source_registry.json"
      - "data/official/releases.json"
      - "migrations/**"
  schedule:
    - cron: "27 */6 * * *"

concurrency:
  group: official-youtube-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check YouTube API connection
        id: youtube
        shell: bash
        run: |
          if [[ -n "$YOUTUBE_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "YouTube API key found; official-channel monitoring enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "YOUTUBE_API_KEY is not configured; official-channel monitoring skipped."
          fi

      - name: Poll official channel uploads
        if: steps.youtube.outputs.ready == 'true'
        run: python scripts/youtube_monitor.py

      - name: Suppress already verified YouTube signals
        if: steps.youtube.outputs.ready == 'true'
        run: python scripts/filter_youtube_candidates.py

      - name: Validate candidate payload
        if: steps.youtube.outputs.ready == 'true'
        run: python -m json.tool data/generated/youtube-release-candidates.json >/dev/null

      - uses: actions/upload-artifact@v4
        if: steps.youtube.outputs.ready == 'true'
        with:
          name: official-youtube-release-candidates
          path: data/generated/youtube-release-candidates.json
          retention-days: 14

      - name: Check Cloudflare connection
        if: steps.youtube.outputs.ready == 'true'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials unavailable; candidate artifact kept but D1 queue sync skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.youtube.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Wrangler
        if: steps.youtube.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Bind D1
        if: steps.youtube.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        if: steps.youtube.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Sync review candidates to D1
        if: steps.youtube.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -s data/generated/youtube-candidates-upsert.sql ]]; then
            npx wrangler d1 execute cinema-and-series --remote --file=data/generated/youtube-candidates-upsert.sql
          else
            echo "No new release-date candidates detected in the latest official uploads."
          fi
