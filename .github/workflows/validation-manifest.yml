name: Validation Corpus Manifest

on:
  push:
    paths:
      - 'validation/**'
      - '.github/workflows/validation-manifest.yml'
  pull_request:
    paths:
      - 'validation/**'
      - '.github/workflows/validation-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: validation/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt

      - name: Validate JSONL corpus manifests
        run: python validation/run_manifest_validation.py
