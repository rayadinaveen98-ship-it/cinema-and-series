name: Validation Corpus Manifest

on:
  push:
    paths:
      - 'validation/**'
      - '.github/workflows/validation-manifest.yml'
  pull_request:
    paths:
      - 'validation/**'
      - '.github/workflows/validation-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: validation/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt

      - name: Validate hard-case corpus manifests
        run: python validation/run_manifest_validation.py

      - name: Audit primary cohort quota mapping
        run: python validation/run_quota_audit.py

      - name: Validate multilingual search benchmark manifests
        run: python validation/search/run_search_manifest_validation.py

      - name: Audit pre-freeze search floors
        run: python validation/search/run_search_floor_audit.py

      - name: Semantic assertion preflight
        run: python validation/semantic/run_semantic_preflight.py

      - name: Execute semantic reference benchmark
        run: python validation/semantic/run_reference_semantics.py
