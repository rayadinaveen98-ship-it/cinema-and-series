name: Public Movie API Smoke — Read Only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-movie-api-smoke.yml"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check live Worker and movie catalogue endpoints
        shell: bash
        env:
          BASE_URL: https://cinema-and-series.rayadinaveen98.workers.dev
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          paths = (
              "/api/health",
              "/api/catalogue-stats",
              "/api/movies?scope=all&limit=1&offset=0",
              "/api/movies?scope=all&limit=60&offset=0",
              "/api/movies?scope=all&limit=60&offset=60",
              "/api/movies?scope=all&country=IN&limit=10&offset=0",
              "/api/movies?scope=all&country=IN&year=2024&limit=40&offset=0",
              "/api/series?limit=60&offset=0",
              "/api/series?limit=60&offset=60",
              "/api/movies?scope=all&official=1&limit=1&offset=0",
              "/api/movies?scope=all&official=1&limit=200&offset=0",
          )
          root = os.environ["BASE_URL"].rstrip("/")
          failures = []
          pages = {}
          for path in paths:
              req = urllib.request.Request(
                  root + path,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "CinemaAndSeries-MovieAPI-Diagnostic/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      payload = json.load(res)
                      pages[path] = payload
                      report = {
                          "path": path,
                          "http": res.status,
                          "source": payload.get("source"),
                          "database": payload.get("database"),
                          "catalogue_total": (payload.get("pagination") or {}).get("total"),
                          "movies_page_size": (len(payload.get("movies")) if isinstance(payload.get("movies"), list) else None),
                          "series_page_size": (len(payload.get("series")) if isinstance(payload.get("series"), list) else None),
                          "error": payload.get("error"),
                      }
                      print("MOVIE_API_SMOKE=" + json.dumps(report, sort_keys=True), flush=True)
                      if res.status != 200 or (path.startswith(("/api/movies", "/api/series")) and payload.get("source") != "d1"):
                          failures.append(path)
              except urllib.error.HTTPError as exc:
                  print("MOVIE_API_FAILURE=" + json.dumps({
                      "path": path, "http": exc.code,
                      "response": exc.read(350).decode("utf-8", errors="replace"),
                  }), flush=True)
                  failures.append(path)
              except (OSError, ValueError) as exc:
                  print("MOVIE_API_FAILURE=" + json.dumps({
                      "path": path, "reason": type(exc).__name__,
                      "detail": str(exc)[:180],
                  }), flush=True)
                  failures.append(path)
          # Load-more must return new titles, never the same first page again.
          for kind, first, second in (
              ("movies", "/api/movies?scope=all&limit=60&offset=0",
               "/api/movies?scope=all&limit=60&offset=60"),
              ("series", "/api/series?limit=60&offset=0",
               "/api/series?limit=60&offset=60"),
          ):
              if first not in pages or second not in pages:
                  continue
              page_a = pages[first].get(kind) or []
              page_b = pages[second].get(kind) or []
              ids_a = {row.get("id") for row in page_a}
              ids_b = {row.get("id") for row in page_b}
              if (len(page_a) != 60 or len(page_b) != 60 or
                      len(ids_a) != len(page_a) or len(ids_b) != len(page_b) or
                      ids_a.intersection(ids_b) or
                      (pages[second].get("pagination") or {}).get("offset") != 60):
                  failures.append(f"{kind}_pagination_overlap_or_missing_rows")
          india = pages.get("/api/movies?scope=all&country=IN&limit=10&offset=0")
          if india and any(row.get("countryCode") != "IN" for row in india.get("movies") or []):
              failures.append("india_country_filter_incorrect")
          # Year-only sourced films must carry the correct origin and never
          # masquerade as an officially verified release date.
          year_page = pages.get("/api/movies?scope=all&country=IN&year=2024&limit=40&offset=0")
          if year_page:
              for film in year_page.get("movies") or []:
                  if film.get("releaseSource") == "wikidata":
                      qid = film.get("wikidataQid")
                      if (film.get("releaseSourceName") != "Wikidata film and year claims"
                          or film.get("releaseSourceUrl") != "https://www.wikidata.org/wiki/" + str(qid)
                          or film.get("datePrecision") != "year"
                          or film.get("verificationStatus") != "unconfirmed"):
                          failures.append("wikidata_provenance_mismatch")
                          break
          if failures:
              print("FAILED_PUBLIC_ENDPOINTS=" + json.dumps(failures))
              sys.exit(1)
          print("PUBLIC_MOVIE_API_HEALTHY=true")
          PY
