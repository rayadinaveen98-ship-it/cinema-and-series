name: India Films — Verified 2026 and 1980s Source Import

on:
  push:
    branches: ["ops/india-new-year-import-20261019"]
    paths: [".github/workflows/india-new-year-import-20261019.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: india-catalogue-autopilot
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Test guarded source reconciliation and SQL importer
        run: python -m unittest tests.test_wikidata_bulk_execute tests.test_wikidata_bulk_stage tests.test_india_category_import -v

      - name: Retrieve new source-stage snapshot from audited run 39205762987
        shell: bash
        run: |
          mkdir -p data/generated/new-year-import
          gh run download 39205762987 --repo "$GITHUB_REPOSITORY" \
            --name indian-films-new-year-source-stage-20261019 \
            --dir data/generated/new-year-import
          test -s data/generated/new-year-import/stage.sqlite
          test -s data/generated/new-year-import/stage-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("data/generated/new-year-import/stage-summary.json").read_text())
          n=report["new_qids"]
          if not 1<=n<=1500 or report.get("production_imported")!=0 or report.get("d1_writes")!=0:
            raise SystemExit("Invalid source stage provenance")
          print("INDIA_NEW_YEAR_SOURCE_STAGE_VALIDATED="+str(n),flush=True)
          PY

      - name: Bind existing Cloudflare D1 without migrations
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Capture fresh production film and series identity snapshots
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/new-year-import
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,release_date FROM movies;" > "$ROOT/exact.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,wikipedia_page_id,title,release_year,source_category FROM catalogue_titles;" > "$ROOT/year.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT wikidata_qid,title,first_air_year FROM series_titles;" > "$ROOT/series.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS count FROM catalogue_titles;" > "$ROOT/before.json"

      - name: Prepare at most 1000 source-backed and deduplicated films
        shell: bash
        run: |
          ROOT=data/generated/new-year-import
          python scripts/wikidata_bulk_import_sql.py \
            --stage "$ROOT/stage.sqlite" \
            --exact-movies "$ROOT/exact.json" \
            --year-movies "$ROOT/year.json" \
            --series "$ROOT/series.json" \
            --max-preview 1000 \
            --out-dir "$ROOT/prepared"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/generated/new-year-import/prepared")
          report=json.loads((root/"reconciliation.json").read_text())
          selected=json.loads((root/"selected.json").read_text())
          if not 0<=len(selected)<=1000 or len(selected)!=report["sql_preview_rows"]:
            raise SystemExit("Invalid reconciliation size")
          if len({r["qid"] for r in selected})!=len(selected):
            raise SystemExit("Duplicate QID")
          print("INDIA_NEW_YEAR_RECONCILIATION="+json.dumps(report,sort_keys=True),flush=True)
          print("INDIA_NEW_YEAR_SELECTED_SAMPLE="+json.dumps([{"qid":x["qid"],"title":x["title"],"year":x["year"]} for x in selected[:20]],sort_keys=True),flush=True)
          PY

      - name: Execute capped, insert-only chunks and verify submitted QIDs
        shell: bash
        run: |
          ROOT=data/generated/new-year-import
          python scripts/wikidata_bulk_execute.py \
            --selected "$ROOT/prepared/selected.json" \
            --sql-dir "$ROOT/prepared" \
            --out-json "$ROOT/import-result.json" \
            --max-row-reads 250000 \
            --apply

      - name: Verify production net-new delta and stop on anomalies
        shell: bash
        run: |
          ROOT=data/generated/new-year-import
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS count FROM catalogue_titles;" > "$ROOT/after.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/generated/new-year-import")
          def total(path):
            return int(json.loads((root/path).read_text())[0]["results"][0]["count"])
          before,after=total("before.json"),total("after.json")
          result=json.loads((root/"import-result.json").read_text())
          submitted=int(result.get("submitted_to_d1",0))
          delta=after-before
          report={"before":before,"after":after,"added":delta,"submitted":submitted,
                  "verified_present_qids":result.get("verified_present_qids"),
                  "status":result.get("status"),"batch":"2026 and 1980s","utc_date":"2026-10-19"}
          print("INDIA_NEW_YEAR_IMPORT="+json.dumps(report,sort_keys=True),flush=True)
          (root/"verified-delta.json").write_text(json.dumps(report,indent=2)+"\n")
          if not 0<=delta<=1000 or delta>submitted or result.get("status") not in ("completed","read_budget_paused"):
            raise SystemExit("Unexpected import delta or quota-state")
          PY

      - name: Upload provenance and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-2026-and-1980s-import-20261019
          path: |
            data/generated/new-year-import/stage-summary.json
            data/generated/new-year-import/prepared/reconciliation.json
            data/generated/new-year-import/prepared/selected.json
            data/generated/new-year-import/import-result.json
            data/generated/new-year-import/verified-delta.json
          retention-days: 30
          if-no-files-found: warn
