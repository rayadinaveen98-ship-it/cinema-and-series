name: Indian Film Language — One-Time D1 Reset Recovery

# October 20 2026 only. Scheduled run did not appear by 09:30 IST.
# A single workflow-file merge can also initiate the existing guarded recovery.
# The October-20 UTC time gate, exact QID checks, and serial concurrency stay.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/india-film-language-quota-reset-20261020.yml"
  schedule:
    - cron: "17 0 20 10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-catalogue-autopilot
  cancel-in-progress: false

jobs:
  restore-languages:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Enforce exact October 20 2026 UTC production window
        id: window
        shell: bash
        run: |
          if [[ "$(date -u +%F)" == "2026-10-20" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "D1_RESET_RECOVERY_WINDOW=2026-10-20"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "One-time import inactive outside 2026-10-20 UTC; no database access."
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.allowed == 'true'
        with: {python-version: "3.13"}

      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with: {node-version: "22"}

      - name: Run source language and SQL safety regression tests
        if: steps.window.outputs.allowed == 'true'
        run: python -m unittest tests.test_reconcile_india_film_languages tests.test_india_film_language_evidence -v

      - name: Restore exact audited CC0 source-evidence checkpoint
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          mkdir -p data/generated/india-film-language-reset
          git fetch --no-tags origin c352657c5113f3126c50e02ad0c4a71f8e2e8c21
          git show c352657c5113f3126c50e02ad0c4a71f8e2e8c21:.automation/india-language-evidence.json \
            > data/generated/india-film-language-reset/source-checkpoint.json
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("data/generated/india-film-language-reset/source-checkpoint.json").read_text())
          assert source["schema"]=="india-film-language-evidence-v1" and len(source["records"])==1200
          print("SOURCE_EVIDENCE_CHECKPOINT_LOCKED=1200")
          PY

      - name: Bind existing D1 and install Wrangler
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Apply pending migration 0027 without resetting any film data
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          python scripts/retry_d1_busy.py --max-retries 4 --delay-seconds 10 -- \
            npx wrangler d1 migrations apply cinema-and-series --remote
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "PRAGMA table_info('catalogue_titles');" \
            > data/generated/india-film-language-reset/schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/generated/india-film-language-reset/schema.json").read_text())
          cols={str(row["name"]) for batch in data for row in batch["results"]}
          assert {"language_source","language_source_url"}.issubset(cols)
          print("INDIA_LANGUAGE_PROVENANCE_SCHEMA_READY=true")
          PY

      - name: Snapshot unknown Indian film languages from the live D1 table
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,release_year,language_name,country_code FROM catalogue_titles WHERE country_code='IN' AND wikidata_qid IS NOT NULL AND (language_name IS NULL OR LOWER(TRIM(language_name)) IN ('','unknown','xx','und','n/a','na','none','null'));" \
            > data/generated/india-film-language-reset/unknown-before.json

      - name: Reconcile against fresh title, QID, year, country and unknown-language state
        if: steps.window.outputs.allowed == 'true'
        id: prepared
        shell: bash
        run: |
          ROOT=data/generated/india-film-language-reset
          python scripts/reconcile_india_film_languages.py \
            --checkpoint "$ROOT/source-checkpoint.json" \
            --production-snapshot "$ROOT/unknown-before.json" \
            --out-dir "$ROOT/proposals" --max-updates 1000
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("data/generated/india-film-language-reset/proposals")
          data=json.loads((root/"reconciliation.json").read_text())
          n=data["selected_count"]
          if not 0 <= n <= 1000 or len({r["qid"] for r in data["selected"]})!=n:
            raise SystemExit("Unsafe language reconciliation count")
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
            output.write(f"count={n}\n")
          print("INDIA_LANGUAGE_RESET_PROPOSALS="+str(n),flush=True)
          PY

      - name: Apply only identity-guarded unknown-language P364 proposals
        if: steps.window.outputs.allowed == 'true' && steps.prepared.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          for sql in data/generated/india-film-language-reset/proposals/language-*.sql; do
            python scripts/retry_d1_busy.py --max-retries 4 --delay-seconds 10 -- \
              npx wrangler d1 execute cinema-and-series --remote --file="$sql"
          done

      - name: Verify every selected QID has exact expected language and provenance
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          ROOT=data/generated/india-film-language-reset
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,release_year,language_name,language_source,language_source_url FROM catalogue_titles WHERE language_source='wikidata:P364';" \
            > "$ROOT/verified-after.json"
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path("data/generated/india-film-language-reset")
          selected=json.loads((root/"proposals/reconciliation.json").read_text())["selected"]
          payload=json.loads((root/"verified-after.json").read_text())
          by_qid={}
          for batch in payload:
            for row in batch.get("results") or []:
              by_qid[row["wikidata_qid"]]=row
          errors=[]
          for expected in selected:
            actual=by_qid.get(expected["qid"])
            if not actual or any([
              actual["id"]!=expected["id"],
              actual["title"].casefold()!=expected["title"].casefold(),
              actual["release_year"]!=expected["year"],
              actual["language_name"]!=expected["language"],
              actual["language_source"]!="wikidata:P364",
              actual["language_source_url"]!=expected["language_source_url"],
            ]):
              errors.append(expected["qid"])
          report={"date":"2026-10-20","selected_count":len(selected),
                  "verified_present":len(selected)-len(errors),
                  "failed_qids":errors[:20],"languages":dict(Counter(x["language"] for x in selected)),
                  "source":"Wikidata P364 original language (not official release verification)"}
          (root/"verified-report.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("INDIA_LANGUAGE_RESET_VERIFIED="+json.dumps(report,sort_keys=True),flush=True)
          if errors:
            raise SystemExit("Source-backed language verification failed")
          PY

      - name: Preserve reconciliation, evidence summary and verification audit
        if: always() && steps.window.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indian-film-language-oct20-provenance-verified
          path: |
            data/generated/india-film-language-reset/proposals/reconciliation.json
            data/generated/india-film-language-reset/verified-report.json
          retention-days: 30
          if-no-files-found: warn
