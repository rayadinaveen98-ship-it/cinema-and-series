name: October 20 — Verified New Title Count (Read Only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/oct20-new-titles-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Bind existing production D1 (read-only, no migrations)
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py
      - name: Count newly created visible records by UTC and India day
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/oct20-creation-audit
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            WITH boundaries(label,start_at,end_at) AS (
              VALUES ('india-2026-10-20','2026-10-19 18:30:00','2026-10-20 18:30:00'),
                     ('utc-2026-10-20','2026-10-20 00:00:00','2026-10-21 00:00:00')
            )
            SELECT b.label,
              (SELECT COUNT(*) FROM movies m WHERE m.created_at >= b.start_at AND m.created_at < b.end_at
                 AND (m.wikidata_qid IS NULL OR m.title<>m.wikidata_qid)) AS new_movie_records,
              (SELECT COUNT(*) FROM catalogue_titles c WHERE c.created_at >= b.start_at AND c.created_at < b.end_at
                 AND (c.wikidata_qid IS NULL OR NOT EXISTS (SELECT 1 FROM movies m
                   WHERE m.wikidata_qid=c.wikidata_qid AND m.title<>m.wikidata_qid))) AS new_distinct_catalogue_movie_records,
              (SELECT COUNT(*) FROM series_titles s WHERE s.created_at >= b.start_at AND s.created_at < b.end_at) AS new_series_records,
              (SELECT COUNT(*) FROM movies m WHERE m.wikidata_qid IS NULL OR m.title<>m.wikidata_qid)
               + (SELECT COUNT(*) FROM catalogue_titles c WHERE c.wikidata_qid IS NULL OR NOT EXISTS (
                   SELECT 1 FROM movies m WHERE m.wikidata_qid=c.wikidata_qid AND m.title<>m.wikidata_qid))
                AS current_total_unique_movie_titles,
              (SELECT COUNT(*) FROM series_titles) AS current_series_titles
            FROM boundaries b;" > data/generated/oct20-creation-audit/totals.json
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT 'movies' AS source_table,id,title,created_at FROM movies
             WHERE created_at>='2026-10-19 18:30:00' AND (wikidata_qid IS NULL OR title<>wikidata_qid)
            UNION ALL SELECT 'catalogue_titles',c.id,c.title,c.created_at FROM catalogue_titles c
             WHERE c.created_at>='2026-10-19 18:30:00'
               AND (c.wikidata_qid IS NULL OR NOT EXISTS (
                 SELECT 1 FROM movies m WHERE m.wikidata_qid=c.wikidata_qid AND m.title<>m.wikidata_qid))
            UNION ALL SELECT 'series_titles',id,title,created_at FROM series_titles
             WHERE created_at>='2026-10-19 18:30:00'
            ORDER BY created_at DESC,title LIMIT 25;" > data/generated/oct20-creation-audit/examples.json
      - name: Summarize genuine newly created rows (not upsert operations)
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('data/generated/oct20-creation-audit')
          def rows(name):
              return [r for b in json.loads((root/name).read_text()) for r in b.get('results',[])]
          totals=rows('totals.json')
          if len(totals)!=2: raise SystemExit('missing UTC/India windows')
          report={'basis':'created_at, not upsert or SQL write count',
             'attribution':'Oct 20 within the selected UTC/India interval',
             'totals':totals,'samples':rows('examples.json'),
             'new_titles_counted_as_production':True,'d1_writes':0}
          (root/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          for r in totals:
              new=int(r['new_movie_records'])+int(r['new_distinct_catalogue_movie_records'])+int(r['new_series_records'])
              print('NEW_TITLES_VERIFIED='+json.dumps({'window':r['label'],'movies_table':r['new_movie_records'],
                  'movie_catalogue_only':r['new_distinct_catalogue_movie_records'],
                  'series':r['new_series_records'],'total_new_created_records':new,
                  'production_movies':r['current_total_unique_movie_titles'],
                  'production_series':r['current_series_titles'],'production_total':
                  r['current_total_unique_movie_titles']+r['current_series_titles']},sort_keys=True),flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f"## {r['label']} — New created records: {new}\n\n")
                  f.write(f"Movies: {r['new_movie_records']} + catalogue-only movies: {r['new_distinct_catalogue_movie_records']}; series: {r['new_series_records']}.\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oct20-verified-new-titles
          path: data/generated/oct20-creation-audit/
          retention-days: 14
          if-no-files-found: warn
