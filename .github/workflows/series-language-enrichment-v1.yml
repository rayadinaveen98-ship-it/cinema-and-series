name: Series Language Enrichment V1

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "migrations/0019_series_language_provenance.sql"
      - "scripts/enrich_series_languages.py"
      - "tests/test_series_language_enrichment.py"
      - ".github/workflows/series-language-enrichment-v1.yml"
  workflow_dispatch:
    inputs:
      apply_writes:
        description: "Apply provenance-safe P364 updates to production D1 after analysis"
        required: false
        default: false
        type: boolean

concurrency:
  group: series-language-enrichment-v1-${{ github.event_name == 'workflow_dispatch' && inputs.apply_writes && 'write' || 'analysis' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.apply_writes) }}

permissions:
  contents: read

env:
  SHARD_COUNT: "8"
  SHARD_SIZE: "1200"
  SNAPSHOT_LIMIT: "8000"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      snapshot_ready: ${{ steps.snapshot.outputs.snapshot_ready }}
      deferred_reason: ${{ steps.snapshot.outputs.deferred_reason }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run enrichment tests
        run: python -m unittest tests.test_series_language_enrichment -v

      - name: Check Cloudflare connection
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare credentials are required for series language enrichment."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        run: python scripts/cloudflare_bootstrap.py

      - name: Capture current production language baseline
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS total_series, SUM(CASE WHEN language_name IS NOT NULL AND TRIM(language_name)<>'' AND LOWER(language_name)<>'unknown' THEN 1 ELSE 0 END) AS language_known FROM series_titles;"

      - name: Capture stable unknown-language SeriesRun snapshot
        id: snapshot
        shell: bash
        run: |
          mkdir -p data/generated
          SNAPSHOT="data/generated/series-language-candidates-snapshot.json"
          STDERR="data/generated/series-language-candidates-snapshot.stderr.txt"

          set +e
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,language_name FROM series_titles WHERE (language_name IS NULL OR TRIM(language_name)='' OR LOWER(language_name)='unknown') AND wikidata_qid IS NOT NULL ORDER BY wikidata_qid LIMIT ${SNAPSHOT_LIMIT};" \
            > "$SNAPSHOT" 2> "$STDERR"
          STATUS=$?
          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo "D1 snapshot capture failed; response follows:"
            cat "$SNAPSHOT" || true
            cat "$STDERR" || true

            if grep -Eq '"code"[[:space:]]*:[[:space:]]*7500|daily row read limit' "$SNAPSHOT" "$STDERR" 2>/dev/null; then
              if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply_writes }}" == "true" ]]; then
                echo "Production write mode requires a fresh D1 snapshot; quota exhaustion is a hard stop."
                exit 1
              fi

              python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "schema_version": "series-language-enrichment-v1-summary",
              "state": "deferred",
              "reason": "cloudflare_d1_daily_row_read_limit",
              "production_mutation": False,
          }
          Path("data/generated/series-language-enrichment-v1-deferred.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
              echo "snapshot_ready=false" >> "$GITHUB_OUTPUT"
              echo "deferred_reason=cloudflare_d1_daily_row_read_limit" >> "$GITHUB_OUTPUT"
              echo "Analysis deferred cleanly because the Cloudflare D1 free-tier daily row-read quota is exhausted."
              exit 0
            fi

            exit "$STATUS"
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/generated/series-language-candidates-snapshot.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          rows = []
          for batch in payload if isinstance(payload, list) else [payload]:
              if isinstance(batch, dict):
                  rows.extend(batch.get("results") or [])
          if len(rows) > 8000:
              raise SystemExit(f"snapshot cap exceeded: {len(rows)}")
          print(f"SERIES_LANGUAGE_SNAPSHOT_ROWS={len(rows)}")
          PY
          echo "snapshot_ready=true" >> "$GITHUB_OUTPUT"
          echo "deferred_reason=" >> "$GITHUB_OUTPUT"

      - name: Preserve stable candidate snapshot
        if: steps.snapshot.outputs.snapshot_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: series-language-enrichment-v1-candidate-snapshot
          path: data/generated/series-language-candidates-snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve quota-deferred state
        if: steps.snapshot.outputs.snapshot_ready == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: series-language-enrichment-v1-deferred
          path: data/generated/series-language-enrichment-v1-deferred.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply D1 migration before production write mode
        if: steps.snapshot.outputs.snapshot_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

  enrich:
    name: enrich-shard-${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.snapshot_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore stable candidate snapshot
        uses: actions/download-artifact@v4
        with:
          name: series-language-enrichment-v1-candidate-snapshot
          path: data/generated

      - name: Resolve explicit Wikidata P364 language shard
        run: |
          python scripts/enrich_series_languages.py \
            --input data/generated/series-language-candidates-snapshot.json \
            --max-series "${SHARD_SIZE}" \
            --shard-index "${SHARD_INDEX}" \
            --shard-count "${SHARD_COUNT}" \
            --out-json "data/generated/series-language-enrichment-v1-${SHARD_INDEX}.json" \
            --sql-out "data/generated/series-language-enrichment-v1-${SHARD_INDEX}.sql"

      - name: Validate bounded shard output
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          shard = int(os.environ["SHARD_INDEX"])
          report = json.loads(Path(f"data/generated/series-language-enrichment-v1-{shard}.json").read_text(encoding="utf-8"))
          candidates = int(report.get("candidate_count") or 0)
          updates = int(report.get("update_count") or 0)
          if report.get("shard_index") != shard or report.get("shard_count") != int(os.environ["SHARD_COUNT"]):
              raise SystemExit("shard metadata mismatch")
          if candidates > int(os.environ["SHARD_SIZE"]):
              raise SystemExit(f"candidate cap exceeded: {candidates}")
          if updates > candidates:
              raise SystemExit(f"updates exceed candidates: updates={updates} candidates={candidates}")
          print("SERIES_LANGUAGE_ENRICHMENT_SHARD_VALIDATED=" + json.dumps({
              "shard": shard,
              "candidates": candidates,
              "updates": updates,
              "ambiguous": report.get("ambiguous_count", 0),
              "missing_claim": report.get("missing_claim_count", 0),
              "missing_label": report.get("missing_label_count", 0),
          }, sort_keys=True))
          PY

      - name: Preserve shard analysis before any production write
        uses: actions/upload-artifact@v4
        with:
          name: series-language-enrichment-v1-analysis-shard-${{ matrix.shard }}
          path: |
            data/generated/series-language-enrichment-v1-${{ matrix.shard }}.json
            data/generated/series-language-enrichment-v1-${{ matrix.shard }}.sql
          if-no-files-found: error
          retention-days: 30

      - name: Explain write gate on analysis runs
        if: github.event_name != 'workflow_dispatch' || inputs.apply_writes != true
        run: echo "Shard analysis complete. No production mutation requested."

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        with:
          node-version: 22

      - name: Install Wrangler for write mode
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        run: npm install --no-audit --no-fund

      - name: Bind production D1 for write mode
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply provenance-safe language shard updates
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          SQL_FILE="data/generated/series-language-enrichment-v1-${SHARD_INDEX}.sql"
          if grep -q '^UPDATE series_titles' "$SQL_FILE"; then
            npx wrangler d1 execute cinema-and-series --remote --file="$SQL_FILE"
          else
            echo "No explicit P364 language updates in shard ${SHARD_INDEX}."
          fi

  summarize:
    needs: [prepare, enrich]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if enrichment was expected but failed
        if: needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result != 'success'
        run: |
          echo "Snapshot was ready, but one or more enrichment shards did not succeed."
          exit 1

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result == 'success'
        with:
          pattern: series-language-enrichment-v1-analysis-shard-*
          path: data/generated/shards
          merge-multiple: true

      - name: Aggregate and validate all shard reports
        if: needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = []
          for shard in range(8):
              path = Path(f"data/generated/shards/series-language-enrichment-v1-{shard}.json")
              if not path.exists():
                  raise SystemExit(f"missing shard report: {path}")
              reports.append(json.loads(path.read_text(encoding="utf-8")))
          seen_qids = set()
          totals = {"candidates": 0, "updates": 0, "ambiguous": 0, "missing_claim": 0, "missing_label": 0}
          for shard, report in enumerate(reports):
              if report.get("shard_index") != shard or report.get("shard_count") != 8:
                  raise SystemExit(f"invalid shard metadata for shard {shard}")
              totals["candidates"] += int(report.get("candidate_count") or 0)
              totals["updates"] += int(report.get("update_count") or 0)
              totals["ambiguous"] += int(report.get("ambiguous_count") or 0)
              totals["missing_claim"] += int(report.get("missing_claim_count") or 0)
              totals["missing_label"] += int(report.get("missing_label_count") or 0)
              for item in report.get("updates") or []:
                  qid = item.get("wikidata_qid")
                  if qid in seen_qids:
                      raise SystemExit(f"duplicate update across shards: {qid}")
                  seen_qids.add(qid)
          if totals["candidates"] > 8000:
              raise SystemExit(f"aggregate candidate cap exceeded: {totals['candidates']}")
          if totals["updates"] != len(seen_qids):
              raise SystemExit("aggregate update count does not match unique QIDs")
          summary = {
              "schema_version": "series-language-enrichment-v1-summary",
              "state": "complete",
              "shards": 8,
              **totals,
          }
          Path("data/generated").mkdir(parents=True, exist_ok=True)
          Path("data/generated/series-language-enrichment-v1-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SERIES_LANGUAGE_ENRICHMENT_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Materialize quota-deferred summary
        if: needs.prepare.outputs.snapshot_ready == 'false'
        env:
          DEFERRED_REASON: ${{ needs.prepare.outputs.deferred_reason }}
        run: |
          mkdir -p data/generated
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = {
              "schema_version": "series-language-enrichment-v1-summary",
              "state": "deferred",
              "reason": os.environ.get("DEFERRED_REASON") or "unknown",
              "production_mutation": False,
          }
          Path("data/generated/series-language-enrichment-v1-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SERIES_LANGUAGE_ENRICHMENT_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.snapshot_ready == 'false' || needs.enrich.result == 'success'
        with:
          name: series-language-enrichment-v1-summary
          path: data/generated/series-language-enrichment-v1-summary.json
          if-no-files-found: error
          retention-days: 30

  verify-write:
    needs: [prepare, enrich, summarize]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main' && needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result == 'success' && needs.summarize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: python scripts/cloudflare_bootstrap.py
      - name: Verify production language coverage
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS total_series, SUM(CASE WHEN language_name IS NOT NULL AND TRIM(language_name)<>'' AND LOWER(language_name)<>'unknown' THEN 1 ELSE 0 END) AS language_known, SUM(CASE WHEN language_source IS NOT NULL AND TRIM(language_source)<>'' THEN 1 ELSE 0 END) AS language_with_provenance FROM series_titles;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT language_name, COUNT(*) AS titles FROM series_titles WHERE language_name IS NOT NULL AND TRIM(language_name)<>'' AND LOWER(language_name)<>'unknown' GROUP BY language_name ORDER BY titles DESC LIMIT 30;"
