name: Series Language Enrichment V1

on:
  push:
    branches: [main]
    paths:
      - "migrations/0019_series_language_provenance.sql"
      - "scripts/enrich_series_languages.py"
      - "tests/test_series_language_enrichment.py"
      - ".github/workflows/series-language-enrichment-v1.yml"
  workflow_dispatch:

concurrency:
  group: series-language-enrichment-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAX_SERIES: "8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run enrichment tests
        run: python -m unittest tests.test_series_language_enrichment -v

      - name: Check Cloudflare connection
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare credentials are required for series language enrichment."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Capture unknown-language SeriesRun candidates
        shell: bash
        run: |
          mkdir -p data/generated
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,language_name FROM series_titles WHERE (language_name IS NULL OR TRIM(language_name)='' OR LOWER(language_name)='unknown') AND wikidata_qid IS NOT NULL ORDER BY wikidata_qid LIMIT ${MAX_SERIES};" \
            > data/generated/series-language-candidates.json

      - name: Resolve explicit Wikidata P364 languages
        run: |
          python scripts/enrich_series_languages.py \
            --input data/generated/series-language-candidates.json \
            --max-series "${MAX_SERIES}" \
            --out-json data/generated/series-language-enrichment-v1.json \
            --sql-out data/generated/series-language-enrichment-v1.sql

      - name: Validate bounded output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/generated/series-language-enrichment-v1.json").read_text(encoding="utf-8"))
          candidates = int(report.get("candidate_count") or 0)
          updates = int(report.get("update_count") or 0)
          if candidates > 8000:
              raise SystemExit(f"candidate cap exceeded: {candidates}")
          if updates > candidates:
              raise SystemExit(f"updates exceed candidates: updates={updates} candidates={candidates}")
          print("SERIES_LANGUAGE_ENRICHMENT_VALIDATED=" + json.dumps({
              "candidates": candidates,
              "updates": updates,
              "ambiguous": report.get("ambiguous_count", 0),
              "missing_claim": report.get("missing_claim_count", 0),
              "missing_label": report.get("missing_label_count", 0),
          }, sort_keys=True))
          PY

      - name: Apply provenance-safe language updates
        shell: bash
        run: |
          if grep -q '^UPDATE series_titles' data/generated/series-language-enrichment-v1.sql; then
            npx wrangler d1 execute cinema-and-series --remote --file=data/generated/series-language-enrichment-v1.sql
          else
            echo "No explicit P364 language updates to apply."
          fi

      - name: Verify production language coverage
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS total_series, SUM(CASE WHEN language_name IS NOT NULL AND TRIM(language_name)<>'' AND LOWER(language_name)<>'unknown' THEN 1 ELSE 0 END) AS language_known, SUM(CASE WHEN language_source IS NOT NULL AND TRIM(language_source)<>'' THEN 1 ELSE 0 END) AS language_with_provenance FROM series_titles;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT language_name, COUNT(*) AS titles FROM series_titles WHERE language_name IS NOT NULL AND TRIM(language_name)<>'' AND LOWER(language_name)<>'unknown' GROUP BY language_name ORDER BY titles DESC LIMIT 30;"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-language-enrichment-v1
          path: |
            data/generated/series-language-candidates.json
            data/generated/series-language-enrichment-v1.json
            data/generated/series-language-enrichment-v1.sql
          if-no-files-found: warn
          retention-days: 30
