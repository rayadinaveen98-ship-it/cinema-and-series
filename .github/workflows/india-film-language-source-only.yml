name: Indian Films — Resumable Language Evidence (Source Only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/india-film-language-source-only.yml"
      - "scripts/india_film_language_evidence.py"
      - "tests/test_india_film_language_evidence.py"
  schedule:
    # Respectful, bounded thrice-daily Wikidata source work. No Cloudflare D1.
    - cron: "20 2,10,18 * * *"
  workflow_dispatch:

concurrency:
  group: india-film-language-source-only
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate film-language evidence and safe resumability
        run: python -m unittest tests.test_india_film_language_evidence -v
      - name: Restore expanded 1940–2026 film identities where available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/india-language
          if git ls-remote --exit-code --heads origin automation/india-language-expanded-stage >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/automation/india-language-expanded-stage
            git show FETCH_HEAD:.automation/india-language-expanded-stage.sqlite \
              > data/generated/india-language/film-stage.sqlite
            echo "Expanded 1940–2026 Indian-language film source stage loaded"
          else
            git fetch --no-tags origin refs/heads/automation/wikidata-bulk-stage
            git show FETCH_HEAD:.automation/wikidata-bulk-stage.sqlite \
              > data/generated/india-language/film-stage.sqlite
            echo "Expanded source stage not initialized; preserving original stage"
          fi
          test -s data/generated/india-language/film-stage.sqlite
          python - <<'PY'
          import sqlite3
          path="data/generated/india-language/film-stage.sqlite"
          with sqlite3.connect(path) as db:
              count=db.execute("SELECT COUNT(*) FROM films WHERE year_conflict=0 AND title_conflict=0").fetchone()[0]
          if count < 1000:
              raise SystemExit("Source stage is unexpectedly small")
          print(f"LANGUAGE_SOURCE_QUALIFIED_FILMS={count}",flush=True)
          PY

      - name: Restore isolated durable language evidence checkpoint
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin automation/india-language-evidence >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/automation/india-language-evidence
            git show FETCH_HEAD:.automation/india-language-evidence.json \
              > data/generated/india-language/checkpoint.json
            echo "Restored source-only language evidence checkpoint"
          else
            echo '{"schema":"india-film-language-evidence-v1","records":{}}' \
              > data/generated/india-language/checkpoint.json
            echo "Initialized source-only language evidence checkpoint"
          fi

      - name: Collect at most 500 film-language source records (NO D1 ACCESS)
        shell: bash
        run: |
          python scripts/india_film_language_evidence.py \
            --stage data/generated/india-language/film-stage.sqlite \
            --checkpoint data/generated/india-language/checkpoint.json \
            --max-films 500 \
            --out-report data/generated/india-language/report.json \
            --out-proposals data/generated/india-language/proposals.json

      - name: Persist checkpoint on separate automation branch
        if: always()
        shell: bash
        run: |
          test -s data/generated/india-language/checkpoint.json
          if git ls-remote --exit-code --heads origin automation/india-language-evidence >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/automation/india-language-evidence
            git worktree add --detach "$RUNNER_TEMP/language-checkpoint-branch" FETCH_HEAD
          else
            git worktree add -b automation/india-language-evidence \
              "$RUNNER_TEMP/language-checkpoint-branch" HEAD
          fi
          mkdir -p "$RUNNER_TEMP/language-checkpoint-branch/.automation"
          cp data/generated/india-language/checkpoint.json \
            "$RUNNER_TEMP/language-checkpoint-branch/.automation/india-language-evidence.json"
          cd "$RUNNER_TEMP/language-checkpoint-branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/india-language-evidence.json
          if git diff --cached --quiet; then
            echo "Source checkpoint unchanged"
          else
            git commit -m "data(source-only): checkpoint film-language evidence"
            git push origin HEAD:refs/heads/automation/india-language-evidence
          fi

      - name: Summarize proposals without claiming official verification
        if: always()
        shell: bash
        run: |
          if [[ -s data/generated/india-language/report.json ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path("data/generated/india-language/report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("## Film language evidence — no D1 reads/writes\n\n")
              summary.write(f"Checked this run: **{report['checked_this_run']}**\n\n")
              summary.write(f"Total checked: **{report['cumulative_checked_qids']}**\n\n")
              summary.write(f"Single-language source evidence: **{report['proposed_single_language']}**\n\n")
              summary.write(f"Explicit film original-language (P364): **{report['strict_p364_original_language']}**\n\n")
              summary.write(f"General-language only (P407): **{report['general_p407_only_language']}**\n\n")
              summary.write(f"Pending: **{report['pending_qids']}**\n\n")
              summary.write(f"Held incomplete film IDs: **{report['held_incomplete_film_entities']}**\n\n")
              summary.write(f"Held incomplete language entities: **{report['held_incomplete_language_entities']}**\n\n")
              summary.write(f"Source API defer/error: **{report['halted_reason'] or 'none'}**\n\n")
              summary.write("All proposals require separate production reconciliation and quality review.\n")
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-film-language-source-evidence
          path: |
            data/generated/india-language/report.json
            data/generated/india-language/proposals.json
          if-no-files-found: warn
          retention-days: 30
