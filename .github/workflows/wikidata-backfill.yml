name: Catalogue Historical Backfill

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_wikidata_backfill.py"
      - "scripts/fetch_mediawiki_backfill.py"
      - "scripts/fetch_mediawiki_resilient.py"
      - "scripts/merge_catalogue_backfills.py"
      - "scripts/wikidata_to_sql.py"
      - "tests/test_wikidata_backfill.py"
      - "tests/test_mediawiki_backfill.py"
      - "tests/test_fetch_mediawiki_resilient.py"
      - "tests/test_merge_catalogue_backfills.py"
      - ".github/workflows/wikidata-backfill.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Catalogue backfill profile
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - india
          - global-recent
          - rotate
          - all-historical

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run catalogue backfill tests
        run: |
          python -m unittest tests.test_wikidata_backfill tests.test_mediawiki_backfill tests.test_fetch_mediawiki_resilient tests.test_merge_catalogue_backfills -v

      - name: Choose backfill profile
        id: profile
        shell: bash
        run: |
          profile="rotate"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            profile="bootstrap"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${{ github.event.inputs.profile }}"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Catalogue backfill profile: $profile"

      - name: Acquire and merge broad Wikimedia catalogue
        id: wikimedia
        shell: bash
        run: |
          rm -f \
            data/generated/wdqs-backfill.json \
            data/generated/mediawiki-backfill.json \
            data/generated/wikidata-backfill.json

          profile="${{ steps.profile.outputs.profile }}"

          set +e
          python scripts/fetch_wikidata_backfill.py \
            --profile "$profile" \
            --max-movies 5000 \
            --out data/generated/wdqs-backfill.json
          primary_code=$?
          set -e

          if [[ $primary_code -eq 0 && -s data/generated/wdqs-backfill.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/generated/wdqs-backfill.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["acquisition_path"] = "wdqs"
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          fallback_needed="true"
          if [[ $primary_code -eq 0 && -s data/generated/wdqs-backfill.json ]]; then
            fallback_needed=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/generated/wdqs-backfill.json").read_text(encoding="utf-8"))
          shards = payload.get("shards") or []
          complete = bool(shards) and all(row.get("status") == "ok" for row in shards)
          print("false" if complete else "true")
          PY
            )
          fi

          fallback_code=0
          if [[ "$fallback_needed" == "true" ]]; then
            fallback_profile="$profile"
            if [[ "$profile" == "bootstrap" ]]; then
              # Existing production coverage is India-heavy. When a bootstrap
              # WDQS run is partial, spend the fallback budget on international
              # breadth first instead of repeating the same Indian shards.
              fallback_profile="global-recent"
            fi
            echo "WDQS acquisition was unavailable or incomplete; adding resilient MediaWiki profile: $fallback_profile"
            set +e
            python scripts/fetch_mediawiki_resilient.py \
              --profile "$fallback_profile" \
              --max-movies 5000 \
              --out data/generated/mediawiki-backfill.json
            fallback_code=$?
            set -e
          else
            echo "All requested WDQS shards succeeded; MediaWiki fallback not needed for this run."
          fi

          inputs=()
          if [[ -s data/generated/wdqs-backfill.json ]]; then
            inputs+=(data/generated/wdqs-backfill.json)
          fi
          if [[ -s data/generated/mediawiki-backfill.json ]]; then
            inputs+=(data/generated/mediawiki-backfill.json)
          fi

          if [[ ${#inputs[@]} -gt 0 ]]; then
            python scripts/merge_catalogue_backfills.py \
              "${inputs[@]}" \
              --max-movies 5000 \
              --out data/generated/wikidata-backfill.json
          fi

          if [[ -s data/generated/wikidata-backfill.json ]]; then
            acquisition=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/generated/wikidata-backfill.json").read_text(encoding="utf-8"))
          print(payload.get("acquisition_path") or "unknown")
          PY
            )
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "acquisition=$acquisition" >> "$GITHUB_OUTPUT"
            echo "Catalogue acquisition path: $acquisition"
            if [[ $fallback_code -ne 0 ]]; then
              echo "MediaWiki fallback deferred, but successful WDQS rows will still be imported safely."
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "acquisition=deferred" >> "$GITHUB_OUTPUT"
            echo "All Wikimedia backfill paths deferred; existing D1 catalogue remains unchanged."
          fi

      - name: Validate backfill payload and build SQL
        if: steps.wikimedia.outputs.ready == 'true'
        shell: bash
        run: |
          python -m json.tool data/generated/wikidata-backfill.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/generated/wikidata-backfill.json").read_text(encoding="utf-8"))
          movies = payload.get("movies") or []
          if len(movies) > 5000:
              raise SystemExit(f"backfill exceeded 5000-movie free-tier safety cap: {len(movies)}")
          qids = [movie.get("wikidata_qid") for movie in movies]
          if len(qids) != len(set(qids)):
              raise SystemExit("duplicate Wikidata QIDs leaked into backfill payload")
          malformed = [
              movie for movie in movies
              if not movie.get("title")
              or movie.get("title") == movie.get("wikidata_qid")
              or not movie.get("release_date")
              or not movie.get("country_code")
          ]
          if malformed:
              raise SystemExit(f"malformed backfill movies: {malformed[:3]}")
          print(
              "validated",
              len(movies),
              "backfill movies via",
              payload.get("acquisition_path", "unknown"),
          )
          for source in payload.get("source_reports") or []:
              print(
                  "source",
                  source.get("acquisition_path"),
                  "profile", source.get("profile"),
                  "movies", source.get("movies"),
              )
              for shard in source.get("shards") or []:
                  print(
                      "shard",
                      shard.get("key"),
                      "page", shard.get("page"),
                      "status", shard.get("status"),
                      "bindings", shard.get("raw_bindings"),
                      "possibly_truncated", shard.get("possibly_truncated"),
                  )
              categories = source.get("category_report") or []
              if categories:
                  populated = [row for row in categories if row.get("status") == "ok" and int(row.get("pages") or 0) > 0]
                  deferred = [row for row in categories if row.get("status") == "deferred"]
                  print(
                      "mediawiki categories:",
                      len(categories),
                      "checked,",
                      len(populated),
                      "populated,",
                      len(deferred),
                      "deferred",
                  )
                  print("sample populated categories:", [(row.get("category"), row.get("pages")) for row in populated[:12]])
          PY
          python scripts/wikidata_to_sql.py \
            --src data/generated/wikidata-backfill.json \
            --out data/generated/wikidata-backfill-upsert.sql

      - uses: actions/upload-artifact@v4
        if: steps.wikimedia.outputs.ready == 'true'
        with:
          name: wikimedia-catalogue-backfill
          path: |
            data/generated/wdqs-backfill.json
            data/generated/mediawiki-backfill.json
            data/generated/wikidata-backfill.json
            data/generated/wikidata-backfill-upsert.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Check Cloudflare connection
        if: steps.wikimedia.outputs.ready == 'true'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials unavailable; artifact retained but D1 backfill skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Wrangler
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Catalogue count before backfill
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS movie_count FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid;"

      - name: Import historical/global backfill
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -s data/generated/wikidata-backfill-upsert.sql ]]; then
            npx wrangler d1 execute cinema-and-series --remote --file=data/generated/wikidata-backfill-upsert.sql
          else
            echo "Backfill payload produced no importable movie rows."
          fi

      - name: Catalogue count after backfill
        if: steps.wikimedia.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS movie_count, COUNT(DISTINCT country_code) AS countries, COUNT(DISTINCT language_name) AS languages FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT country_code, COUNT(*) AS movies FROM movies WHERE wikidata_qid IS NOT NULL AND title <> wikidata_qid GROUP BY country_code ORDER BY movies DESC LIMIT 20;"
