name: Catalogue Historical Backfill

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_wikidata_backfill.py"
      - "scripts/wikidata_to_sql.py"
      - "tests/test_wikidata_backfill.py"
      - ".github/workflows/wikidata-backfill.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Wikidata backfill profile
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - india
          - global-recent
          - rotate
          - all-historical

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Choose backfill profile
        id: profile
        shell: bash
        run: |
          profile="rotate"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            profile="bootstrap"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${{ github.event.inputs.profile }}"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Catalogue backfill profile: $profile"

      - name: Fetch sharded Wikidata catalogue
        id: wikidata
        shell: bash
        run: |
          set +e
          python scripts/fetch_wikidata_backfill.py \
            --profile "${{ steps.profile.outputs.profile }}" \
            --max-movies 5000 \
            --out data/generated/wikidata-backfill.json
          code=$?
          set -e
          if [[ $code -eq 0 && -s data/generated/wikidata-backfill.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Wikidata backfill deferred; existing D1 catalogue remains unchanged."
          fi

      - name: Validate backfill payload and build SQL
        if: steps.wikidata.outputs.ready == 'true'
        shell: bash
        run: |
          python -m json.tool data/generated/wikidata-backfill.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/generated/wikidata-backfill.json").read_text(encoding="utf-8"))
          movies = payload.get("movies") or []
          if len(movies) > 5000:
              raise SystemExit(f"backfill exceeded 5000-movie free-tier safety cap: {len(movies)}")
          qids = [movie.get("wikidata_qid") for movie in movies]
          if len(qids) != len(set(qids)):
              raise SystemExit("duplicate Wikidata QIDs leaked into backfill payload")
          malformed = [
              movie for movie in movies
              if not movie.get("title")
              or movie.get("title") == movie.get("wikidata_qid")
              or not movie.get("release_date")
              or not movie.get("country_code")
          ]
          if malformed:
              raise SystemExit(f"malformed backfill movies: {malformed[:3]}")
          print(f"validated {len(movies)} backfill movies")
          for shard in payload.get("shards") or []:
              print(
                  "shard",
                  shard.get("key"),
                  "page", shard.get("page"),
                  "status", shard.get("status"),
                  "bindings", shard.get("raw_bindings"),
                  "possibly_truncated", shard.get("possibly_truncated"),
              )
          PY
          python scripts/wikidata_to_sql.py \
            --src data/generated/wikidata-backfill.json \
            --out data/generated/wikidata-backfill-upsert.sql

      - uses: actions/upload-artifact@v4
        if: steps.wikidata.outputs.ready == 'true'
        with:
          name: wikidata-catalogue-backfill
          path: |
            data/generated/wikidata-backfill.json
            data/generated/wikidata-backfill-upsert.sql
          retention-days: 14

      - name: Check Cloudflare connection
        if: steps.wikidata.outputs.ready == 'true'
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials unavailable; artifact retained but D1 backfill skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Wrangler
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Catalogue count before backfill
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS movie_count FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid;"

      - name: Import historical/global backfill
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -s data/generated/wikidata-backfill-upsert.sql ]]; then
            npx wrangler d1 execute cinema-and-series --remote --file=data/generated/wikidata-backfill-upsert.sql
          else
            echo "Backfill payload produced no importable movie rows."
          fi

      - name: Catalogue count after backfill
        if: steps.wikidata.outputs.ready == 'true' && steps.cloudflare.outputs.ready == 'true'
        run: |
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT COUNT(*) AS movie_count, COUNT(DISTINCT country_code) AS countries, COUNT(DISTINCT language_name) AS languages FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid;"
          npx wrangler d1 execute cinema-and-series --remote --command "SELECT country_code, COUNT(*) AS movies FROM movies WHERE wikidata_qid IS NOT NULL AND title <> wikidata_qid GROUP BY country_code ORDER BY movies DESC LIMIT 20;"
