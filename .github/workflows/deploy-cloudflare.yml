name: Deploy Fast V1 to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "migrations/**"
      - "scripts/cloudflare_bootstrap.py"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare connection
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials found; deployment enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; deployment skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Find or create D1 and bind it
        if: steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Production build
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run build

      - name: Deploy Worker and static assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy
