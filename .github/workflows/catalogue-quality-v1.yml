name: Catalogue Quality V1

on:
  push:
    branches: [main, "feature/catalogue-quality-v1"]
    paths:
      - "scripts/production_catalogue_quality.py"
      - "tests/test_production_catalogue_quality.py"
      - ".github/workflows/catalogue-quality-v1.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: catalogue-quality-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run quality-engine tests
        run: python -m unittest tests.test_production_catalogue_quality -v

      - name: Check Cloudflare connection
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare credentials are required for the production quality audit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        run: python scripts/cloudflare_bootstrap.py

      - name: Capture read-only production snapshots
        shell: bash
        run: |
          mkdir -p data/generated
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,native_title,language_name,country_code,release_date,verification_status,release_date_source,poster_url FROM movies;" \
            > data/generated/quality-movies.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,wikipedia_page_id,title,release_year,language_name,country_code,source_category,source_url,verification_status FROM catalogue_titles;" \
            > data/generated/quality-catalogue-movies.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,wikipedia_page_id,title,native_title,series_kind,language_name,country_code,first_air_year,last_air_year,lifecycle_status,season_count,episode_count,source_category,source_url,verification_status FROM series_titles;" \
            > data/generated/quality-series.json

      - name: Run production quality audit
        run: |
          python scripts/production_catalogue_quality.py \
            --movies data/generated/quality-movies.json \
            --catalogue data/generated/quality-catalogue-movies.json \
            --series data/generated/quality-series.json \
            --out-json data/generated/catalogue-quality-v1.json \
            --out-md data/generated/catalogue-quality-v1.md \
            --fail-on-critical

      - name: Print concise quality metrics
        if: always()
        run: |
          if [[ -f data/generated/catalogue-quality-v1.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/generated/catalogue-quality-v1.json").read_text(encoding="utf-8"))
          print("QUALITY_COUNTS=" + json.dumps(report["counts"], sort_keys=True))
          print("QUALITY_FINDINGS=" + json.dumps(report["finding_summary"], sort_keys=True))
          print("QUALITY_MOVIE_COVERAGE=" + json.dumps(report["coverage"]["movies"], sort_keys=True))
          print("QUALITY_SERIES_COVERAGE=" + json.dumps(report["coverage"]["series"], sort_keys=True))
          print("QUALITY_INDIA_LANGUAGES=" + json.dumps(report["india_priority_languages"], sort_keys=True))
          PY
          fi

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/generated/catalogue-quality-v1.md ]]; then
            cat data/generated/catalogue-quality-v1.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-quality-v1
          path: |
            data/generated/catalogue-quality-v1.json
            data/generated/catalogue-quality-v1.md
            data/generated/quality-movies.json
            data/generated/quality-catalogue-movies.json
            data/generated/quality-series.json
          if-no-files-found: warn
          retention-days: 30
