name: P1 Collision Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-collision-diagnostic-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler and bind production D1
        run: |
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py
      - name: Capture collision rows read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/p1-collision-diagnostic
          QIDS="'Q3049630','Q3146368'"
          npx wrangler d1 execute cinema-and-series --remote --json --command "SELECT * FROM movies WHERE wikidata_qid IN (${QIDS}) ORDER BY wikidata_qid,id;" > data/generated/p1-collision-diagnostic/movies.json
          npx wrangler d1 execute cinema-and-series --remote --json --command "SELECT * FROM catalogue_titles WHERE wikidata_qid IN (${QIDS}) ORDER BY wikidata_qid,id;" > data/generated/p1-collision-diagnostic/catalogue_titles.json
          npx wrangler d1 execute cinema-and-series --remote --json --command "SELECT * FROM series_titles WHERE wikidata_qid IN (${QIDS}) ORDER BY wikidata_qid,id;" > data/generated/p1-collision-diagnostic/series_titles.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/generated/p1-collision-diagnostic')
          out={}
          for name in ('movies','catalogue_titles','series_titles'):
              payload=json.loads((root/f'{name}.json').read_text(encoding='utf-8'))
              rows=[]
              for batch in payload if isinstance(payload,list) else [payload]:
                  if isinstance(batch,dict): rows.extend(batch.get('results') or [])
              out[name]=rows
          (root/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('P1_COLLISION_DIAGNOSTIC='+json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-collision-diagnostic-${{ github.run_id }}
          path: data/generated/p1-collision-diagnostic/**
          retention-days: 30
