name: P2 Artwork Coverage Audit Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p2-artwork-coverage-audit-once.yml"
      - "scripts/build_p2_production_artwork_snapshot.py"
      - "scripts/build_p2_artwork_audit_snapshot.py"
      - "scripts/p2_artwork_coverage_audit.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm install --no-audit --no-fund
      - name: Export exact production identities and legacy artwork evidence
        run: |
          mkdir -p audit-output
          npx wrangler d1 execute cinema-and-series --remote --json             --command "SELECT id, language_name, country_code, poster_url, backdrop_url, artwork_source, artwork_source_url FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid ORDER BY id ASC"             > audit-output/movies.json
          npx wrangler d1 execute cinema-and-series --remote --json             --command "SELECT id, language_name, country_code FROM series_titles ORDER BY id ASC"             > audit-output/series.json
          npx wrangler d1 execute cinema-and-series --remote --json             --command "SELECT ct.id, ct.language_name, ct.country_code
  FROM catalogue_titles ct
  WHERE ct.wikidata_qid IS NULL
     OR NOT EXISTS (
       SELECT 1 FROM movies m
       WHERE m.wikidata_qid = ct.wikidata_qid
         AND m.title <> m.wikidata_qid
     )
  ORDER BY ct.id ASC"             > audit-output/catalogue_titles.json
      - name: Build deterministic coverage snapshot
        run: |
          python scripts/build_p2_production_artwork_snapshot.py             --movies audit-output/movies.json             --series audit-output/series.json             --catalogue-titles audit-output/catalogue_titles.json             --territory IN             --evaluated-at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"             --output-dir audit-output
      - uses: actions/upload-artifact@v4
        with:
          name: p2-artwork-coverage-audit-once
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
