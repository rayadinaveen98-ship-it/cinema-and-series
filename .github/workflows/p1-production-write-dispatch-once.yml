name: P1 Production Write Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-production-write-dispatch-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch guarded P1 production shard 0 through V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run recommendation-metadata-production-write-v2.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f mode=write_shard \
            -f shard_index=0 \
            -f apply_production_write=true
