name: Phase 2 browser QA (mocked APIs)

# Release-blocking interaction tests now run for active V1 changes, not
# only the three historical feature branches. APIs are locally mocked: 0 D1 reads.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "package.json"
      - "index.html"
      - ".github/workflows/phase2-browser-qa.yml"
  pull_request:
    paths:
      - "src/**"
      - "worker/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "package.json"
      - "index.html"
      - ".github/workflows/phase2-browser-qa.yml"
  workflow_dispatch:

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI dependencies and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Compile web application
        run: npm run build
      - name: Test actual Chromium interactions against mocked catalogue API
        run: npx playwright test
      - name: Keep screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-series-phase2-browser-qa
          path: |
            artifacts/browser-results/
            artifacts/browser-report/
          retention-days: 14
          if-no-files-found: ignore
