name: Series First-Air-Year Enrichment V1

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "migrations/0020_series_first_air_year_provenance.sql"
      - "scripts/enrich_series_first_air_year.py"
      - "tests/test_series_first_air_year_enrichment.py"
      - ".github/workflows/series-first-air-year-enrichment-v1.yml"
  workflow_dispatch:
    inputs:
      apply_writes:
        description: "Apply provenance-safe P580 first-air-year updates to production D1 after analysis"
        required: false
        default: false
        type: boolean

concurrency:
  group: series-first-air-year-enrichment-v1-${{ github.event_name == 'workflow_dispatch' && inputs.apply_writes && 'write' || 'analysis' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.apply_writes) }}

permissions:
  contents: read

env:
  SNAPSHOT_LIMIT: "500"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      snapshot_ready: ${{ steps.snapshot.outputs.snapshot_ready }}
      deferred_reason: ${{ steps.snapshot.outputs.deferred_reason }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run first-air-year enrichment tests
        run: python -m unittest tests.test_series_first_air_year_enrichment -v

      - name: Check Cloudflare connection
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare credentials are required for Series first-air-year enrichment."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        run: python scripts/cloudflare_bootstrap.py

      - name: Capture stable missing-year SeriesRun snapshot
        id: snapshot
        shell: bash
        run: |
          mkdir -p data/generated
          SNAPSHOT="data/generated/series-first-air-year-candidates-snapshot.json"
          STDERR="data/generated/series-first-air-year-candidates-snapshot.stderr.txt"

          set +e
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,first_air_year FROM series_titles WHERE first_air_year IS NULL ORDER BY id LIMIT ${SNAPSHOT_LIMIT};" \
            > "$SNAPSHOT" 2> "$STDERR"
          STATUS=$?
          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo "D1 snapshot capture failed; response follows:"
            cat "$SNAPSHOT" || true
            cat "$STDERR" || true

            if grep -Eq '"code"[[:space:]]*:[[:space:]]*7500|daily row read limit' "$SNAPSHOT" "$STDERR" 2>/dev/null; then
              if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply_writes }}" == "true" ]]; then
                echo "Production write mode requires a fresh D1 snapshot; quota exhaustion is a hard stop."
                exit 1
              fi

              python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "schema_version": "series-first-air-year-enrichment-v1-summary",
              "state": "deferred",
              "reason": "cloudflare_d1_daily_row_read_limit",
              "production_mutation": False,
          }
          Path("data/generated/series-first-air-year-enrichment-v1-deferred.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
              echo "snapshot_ready=false" >> "$GITHUB_OUTPUT"
              echo "deferred_reason=cloudflare_d1_daily_row_read_limit" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            exit "$STATUS"
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/generated/series-first-air-year-candidates-snapshot.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          rows = []
          for batch in payload if isinstance(payload, list) else [payload]:
              if isinstance(batch, dict):
                  rows.extend(batch.get("results") or [])
          if len(rows) > 500:
              raise SystemExit(f"snapshot cap exceeded: {len(rows)}")
          print(f"SERIES_FIRST_AIR_YEAR_SNAPSHOT_ROWS={len(rows)}")
          PY
          echo "snapshot_ready=true" >> "$GITHUB_OUTPUT"
          echo "deferred_reason=" >> "$GITHUB_OUTPUT"

      - name: Preserve stable candidate snapshot
        if: steps.snapshot.outputs.snapshot_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: series-first-air-year-enrichment-v1-candidate-snapshot
          path: data/generated/series-first-air-year-candidates-snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve quota-deferred state
        if: steps.snapshot.outputs.snapshot_ready == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: series-first-air-year-enrichment-v1-deferred
          path: data/generated/series-first-air-year-enrichment-v1-deferred.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply D1 migration before production write mode
        if: steps.snapshot.outputs.snapshot_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

  enrich:
    needs: prepare
    if: needs.prepare.outputs.snapshot_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore stable candidate snapshot
        uses: actions/download-artifact@v4
        with:
          name: series-first-air-year-enrichment-v1-candidate-snapshot
          path: data/generated

      - name: Resolve explicit Wikidata P580 first-air years
        run: |
          python scripts/enrich_series_first_air_year.py \
            --input data/generated/series-first-air-year-candidates-snapshot.json \
            --max-series "${SNAPSHOT_LIMIT}" \
            --out-json data/generated/series-first-air-year-enrichment-v1.json \
            --sql-out data/generated/series-first-air-year-enrichment-v1.sql

      - name: Validate bounded analysis output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/generated/series-first-air-year-enrichment-v1.json").read_text(encoding="utf-8"))
          fields = ("update_count", "ambiguous_count", "missing_claim_count", "unusable_time_count", "missing_identity_count")
          snapshot = int(report.get("snapshot_count") or 0)
          total = sum(int(report.get(field) or 0) for field in fields)
          if snapshot > 500:
              raise SystemExit(f"snapshot cap exceeded: {snapshot}")
          if total != snapshot:
              raise SystemExit(f"analysis categories do not partition snapshot: total={total} snapshot={snapshot}")
          if int(report.get("candidate_count") or 0) + int(report.get("missing_identity_count") or 0) != snapshot:
              raise SystemExit("identity partition does not match snapshot")
          print("SERIES_FIRST_AIR_YEAR_ANALYSIS_VALIDATED=" + json.dumps({
              "snapshot": snapshot,
              "candidates": report.get("candidate_count", 0),
              "missing_identity": report.get("missing_identity_count", 0),
              "updates": report.get("update_count", 0),
              "ambiguous": report.get("ambiguous_count", 0),
              "missing_claim": report.get("missing_claim_count", 0),
              "unusable_time": report.get("unusable_time_count", 0),
          }, sort_keys=True))
          PY

      - name: Preserve analysis before any production write
        uses: actions/upload-artifact@v4
        with:
          name: series-first-air-year-enrichment-v1-analysis
          path: |
            data/generated/series-first-air-year-enrichment-v1.json
            data/generated/series-first-air-year-enrichment-v1.sql
          if-no-files-found: error
          retention-days: 30

      - name: Explain write gate on analysis runs
        if: github.event_name != 'workflow_dispatch' || inputs.apply_writes != true
        run: echo "First-air-year analysis complete. No production mutation requested."

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        with:
          node-version: 22

      - name: Install Wrangler for write mode
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        run: npm install --no-audit --no-fund

      - name: Bind production D1 for write mode
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply provenance-safe first-air-year updates
        if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          SQL_FILE="data/generated/series-first-air-year-enrichment-v1.sql"
          if grep -q '^UPDATE series_titles' "$SQL_FILE"; then
            npx wrangler d1 execute cinema-and-series --remote --file="$SQL_FILE"
          else
            echo "No explicit P580 first-air-year updates to apply."
          fi

  summarize:
    needs: [prepare, enrich]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if enrichment was expected but failed
        if: needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result != 'success'
        run: |
          echo "Snapshot was ready, but enrichment did not succeed."
          exit 1

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result == 'success'
        with:
          name: series-first-air-year-enrichment-v1-analysis
          path: data/generated

      - name: Materialize complete summary
        if: needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/generated/series-first-air-year-enrichment-v1.json").read_text(encoding="utf-8"))
          summary = {
              "schema_version": "series-first-air-year-enrichment-v1-summary",
              "state": "complete",
              "snapshot": int(report.get("snapshot_count") or 0),
              "candidates": int(report.get("candidate_count") or 0),
              "missing_identity": int(report.get("missing_identity_count") or 0),
              "updates": int(report.get("update_count") or 0),
              "ambiguous": int(report.get("ambiguous_count") or 0),
              "missing_claim": int(report.get("missing_claim_count") or 0),
              "unusable_time": int(report.get("unusable_time_count") or 0),
          }
          if summary["updates"] + summary["ambiguous"] + summary["missing_claim"] + summary["unusable_time"] + summary["missing_identity"] != summary["snapshot"]:
              raise SystemExit("summary categories do not partition snapshot")
          Path("data/generated/series-first-air-year-enrichment-v1-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SERIES_FIRST_AIR_YEAR_ENRICHMENT_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Materialize quota-deferred summary
        if: needs.prepare.outputs.snapshot_ready == 'false'
        env:
          DEFERRED_REASON: ${{ needs.prepare.outputs.deferred_reason }}
        run: |
          mkdir -p data/generated
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = {
              "schema_version": "series-first-air-year-enrichment-v1-summary",
              "state": "deferred",
              "reason": os.environ.get("DEFERRED_REASON") or "unknown",
              "production_mutation": False,
          }
          Path("data/generated/series-first-air-year-enrichment-v1-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SERIES_FIRST_AIR_YEAR_ENRICHMENT_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.snapshot_ready == 'false' || needs.enrich.result == 'success'
        with:
          name: series-first-air-year-enrichment-v1-summary
          path: data/generated/series-first-air-year-enrichment-v1-summary.json
          if-no-files-found: error
          retention-days: 30

  verify-write:
    needs: [prepare, enrich, summarize]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_writes == true && github.ref == 'refs/heads/main' && needs.prepare.outputs.snapshot_ready == 'true' && needs.enrich.result == 'success' && needs.summarize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: python scripts/cloudflare_bootstrap.py

      - uses: actions/download-artifact@v4
        with:
          name: series-first-air-year-enrichment-v1-analysis
          path: data/generated

      - name: Verify production first-air-year coverage and provenance
        shell: bash
        run: |
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS total, SUM(CASE WHEN first_air_year IS NOT NULL THEN 1 ELSE 0 END) AS year_known, SUM(CASE WHEN first_air_year IS NULL THEN 1 ELSE 0 END) AS year_unknown, SUM(CASE WHEN first_air_year_source='wikidata:P580' AND first_air_year IS NOT NULL THEN 1 ELSE 0 END) AS p580_provenance, SUM(CASE WHEN first_air_year_source IS NOT NULL AND first_air_year IS NULL THEN 1 ELSE 0 END) AS invalid_provenance FROM series_titles;" \
            > data/generated/series-first-air-year-post-write.json

          python - <<'PY'
          import json
          from pathlib import Path
          analysis = json.loads(Path("data/generated/series-first-air-year-enrichment-v1.json").read_text(encoding="utf-8"))
          payload = json.loads(Path("data/generated/series-first-air-year-post-write.json").read_text(encoding="utf-8"))
          rows = []
          for batch in payload if isinstance(payload, list) else [payload]:
              if isinstance(batch, dict):
                  rows.extend(batch.get("results") or [])
          if len(rows) != 1:
              raise SystemExit(f"unexpected verification row count: {len(rows)}")
          row = rows[0]
          expected_updates = int(analysis.get("update_count") or 0)
          p580 = int(row.get("p580_provenance") or 0)
          invalid = int(row.get("invalid_provenance") or 0)
          if p580 < expected_updates:
              raise SystemExit(f"P580 provenance count {p580} is below analyzed updates {expected_updates}")
          if invalid != 0:
              raise SystemExit(f"invalid first-air-year provenance rows detected: {invalid}")
          print("SERIES_FIRST_AIR_YEAR_POST_WRITE=" + json.dumps(row, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: series-first-air-year-enrichment-v1-post-write
          path: data/generated/series-first-air-year-post-write.json
          if-no-files-found: error
          retention-days: 30
