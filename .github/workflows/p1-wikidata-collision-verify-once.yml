name: P1 Wikidata Collision Verify Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-wikidata-collision-verify-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch exact Wikidata entities and P31 types
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          UA='cinema-and-series-p1-collision-audit/1.0 (GitHub Actions; read-only)'
          def api(params):
              url='https://www.wikidata.org/w/api.php?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          qids=['Q3049630','Q3146368']
          data=api({'action':'wbgetentities','ids':'|'.join(qids),'props':'labels|descriptions|claims|sitelinks','languages':'en','format':'json','origin':'*'})
          type_ids=[]
          result={}
          for qid in qids:
              ent=data['entities'][qid]
              p31=[]
              for claim in (ent.get('claims') or {}).get('P31',[]):
                  try:
                      value=claim['mainsnak']['datavalue']['value']['id']
                  except Exception:
                      continue
                  p31.append(value); type_ids.append(value)
              result[qid]={
                  'label':(ent.get('labels') or {}).get('en',{}).get('value'),
                  'description':(ent.get('descriptions') or {}).get('en',{}).get('value'),
                  'p31':p31,
                  'enwiki_title':(ent.get('sitelinks') or {}).get('enwiki',{}).get('title'),
              }
          types={}
          if type_ids:
              tdata=api({'action':'wbgetentities','ids':'|'.join(sorted(set(type_ids))),'props':'labels|descriptions','languages':'en','format':'json','origin':'*'})
              for tid,ent in tdata.get('entities',{}).items():
                  types[tid]={
                      'label':(ent.get('labels') or {}).get('en',{}).get('value'),
                      'description':(ent.get('descriptions') or {}).get('en',{}).get('value'),
                  }
          out={'entities':result,'types':types}
          print('P1_WIKIDATA_COLLISION_VERIFY='+json.dumps(out,sort_keys=True))
          PY
