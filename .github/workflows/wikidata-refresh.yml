name: Catalogue Source Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wikidata-refresh.yml"
      - "scripts/fetch_wikidata.py"
      - "scripts/wikidata_to_sql.py"
      - "scripts/official_to_sql.py"
      - "scripts/artwork_refresh.py"
      - "scripts/catalogue_audit.py"
      - "scripts/cloudflare_bootstrap.py"
      - "data/official/**"
      - "migrations/**"
  schedule:
    - cron: "17 */12 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch India film release candidates
        id: wikidata
        continue-on-error: true
        run: python scripts/fetch_wikidata.py

      - name: Validate Wikidata payload
        if: steps.wikidata.outcome == 'success'
        run: python -m json.tool data/generated/wikidata-india.json >/dev/null

      - name: Report Wikidata degradation
        if: steps.wikidata.outcome != 'success'
        run: echo "Wikidata acquisition is temporarily unavailable; preserving the existing D1 catalogue and continuing with first-party sources."

      - name: Validate official source payloads
        run: |
          python -m json.tool data/official/source_registry.json >/dev/null
          python -m json.tool data/official/releases.json >/dev/null

      - name: Audit catalogue quality
        run: python scripts/catalogue_audit.py

      - name: Build Wikidata D1 SQL
        if: steps.wikidata.outcome == 'success'
        run: python scripts/wikidata_to_sql.py

      - name: Build official-source D1 SQL
        run: python scripts/official_to_sql.py

      - name: Build artwork D1 SQL
        run: |
          python scripts/artwork_refresh.py
          python -m json.tool data/generated/artwork-report.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-series-source-refresh
          path: data/generated/
          retention-days: 7
          if-no-files-found: warn

      - name: Check Cloudflare connection
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials found; catalogue sync enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; artifacts generated but D1 sync skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Find or create D1 and bind it
        if: steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Sync Wikidata candidates to D1
        if: steps.cloudflare.outputs.ready == 'true' && steps.wikidata.outcome == 'success'
        run: npx wrangler d1 execute cinema-and-series --remote --file=data/generated/wikidata-upsert.sql

      - name: Sync official sources and verified dates to D1
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute cinema-and-series --remote --file=data/generated/official-upsert.sql

      - name: Sync artwork to D1
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute cinema-and-series --remote --file=data/generated/artwork-upsert.sql
