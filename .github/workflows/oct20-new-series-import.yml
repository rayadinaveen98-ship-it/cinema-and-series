name: October 20 — Net-New TV Series Import (Guarded)

# One-time explicit user-requested production growth beyond Indian films.
# No recurring series writes, no TMDB, no artwork imports.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oct20-new-series-import.yml"
  workflow_dispatch:

concurrency:
  group: india-catalogue-autopilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Authorize only the October 20 2026 UTC window
        id: guard
        run: |
          if [[ "$(date -u +%F)" == "2026-10-20" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "No D1 writes outside authorized date."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.allowed == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.allowed == 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.allowed == 'true'
        with:
          node-version: "22"

      - name: Check source identity, insert-only SQL and quota-stop regression
        if: steps.guard.outputs.allowed == 'true'
        run: python -m unittest tests.test_oct20_new_series_import tests.test_wikipedia_series_catalogue -v

      - name: Acquire year-backed television-series leads from historical and recent categories
        if: steps.guard.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          ROOT=data/generated/oct20-series-import
          mkdir -p "$ROOT"
          python scripts/fetch_wikipedia_series_catalogue.py \
            --profile all-historical --max-series 3500 \
            --out "$ROOT/historical.json" \
            --sql-out "$ROOT/historical-preview.sql"
          python scripts/fetch_wikipedia_series_catalogue.py \
            --profile global-recent --max-series 3500 \
            --out "$ROOT/recent.json" \
            --sql-out "$ROOT/recent-preview.sql"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/generated/oct20-series-import")
          for file in ("historical.json","recent.json"):
              data=json.loads((root/file).read_text())
              rows=data.get("series") or []
              if not 1<=len(rows)<=3500: raise SystemExit("Invalid series discovery batch")
              print(f"SERIES_SOURCE_LEADS_{file}={len(rows)}",flush=True)
          PY

      - name: Bind existing Cloudflare D1 without migrations
        if: steps.guard.outputs.allowed == 'true'
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Read fresh title identities and baseline in production
        if: steps.guard.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          ROOT=data/generated/oct20-series-import
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT wikidata_qid,title,release_date FROM movies;" > "$ROOT/exact.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT wikidata_qid,title,release_year FROM catalogue_titles;" > "$ROOT/catalogue.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT wikidata_qid,title,first_air_year FROM series_titles;" > "$ROOT/series.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS before_count FROM series_titles;" > "$ROOT/before.json"

      - name: Import only genuinely missing source-backed series, preserve D1 headroom
        if: steps.guard.outputs.allowed == 'true'
        run: |
          ROOT=data/generated/oct20-series-import
          python scripts/oct20_new_series_import.py \
            --source "$ROOT/historical.json" --source "$ROOT/recent.json" \
            --exact "$ROOT/exact.json" --catalogue "$ROOT/catalogue.json" \
            --series "$ROOT/series.json" --output-dir "$ROOT/import"

      - name: Verify net-new series count from live D1
        if: steps.guard.outputs.allowed == 'true'
        id: result
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("data/generated/oct20-series-import/import/result.json")
          s=json.loads(p.read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("quota_paused="+("true" if s["status"]=="cloudflare_quota_paused" else "false")+"\n")
          PY
      - name: Verify independent production count if read quota remains
        if: steps.guard.outputs.allowed == 'true' && steps.result.outputs.quota_paused != 'true'
        run: |
          set -euo pipefail
          ROOT=data/generated/oct20-series-import
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS after_count FROM series_titles;" > "$ROOT/after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.production_catalogue_quality import load_d1_rows
          root=Path("data/generated/oct20-series-import")
          before=int(load_d1_rows(root/"before.json")[0]["before_count"])
          after=int(load_d1_rows(root/"after.json")[0]["after_count"])
          result=json.loads((root/"import/result.json").read_text())
          preview=json.loads((root/"import/preview.json").read_text())
          created=after-before
          if created<0 or created>result["submitted"] or created!=result["verified_present_new_qids"]:
              raise SystemExit("Series import did not match independently verified net rows")
          report={"date":"2026-10-20","new_series_in_production":created,
                  "series_before":before,"series_after":after,
                  "candidate_series_not_present":preview["selected_net_new"],
                  "submitted":result["submitted"],"status":result["status"],
                  "source":"Specific Wikipedia year-country television debuts",
                  "first_air_date":"year-only unconfirmed","d1_sql_reads":result["sql_rows_read"],
                  "no_existing_title_updates":True}
          (root/"net-new-verified.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("OCT20_NEW_SERIES_VERIFIED="+json.dumps(report,sort_keys=True),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"## New series added: {created:,}\n\n")
              f.write(f"Production series: {before:,} → {after:,}. Source leads are not added counts.\n\n")
              f.write(f"All imported series remain unconfirmed year-precision.\n")
          PY
      - name: Report verified partial quantity if read quota exhausted
        if: steps.guard.outputs.allowed == 'true' && steps.result.outputs.quota_paused == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/generated/oct20-series-import/import/result.json")
          v=json.loads(p.read_text())
          print("SERIES_D1_QUOTA_PAUSED_VERIFIED_QIDS="+str(v["verified_present_new_qids"]))
          PY

      - name: Archive proof of true new series and source provenance
        if: always() && steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oct20-new-series-import-verified
          path: |
            data/generated/oct20-series-import/import/preview.json
            data/generated/oct20-series-import/import/result.json
            data/generated/oct20-series-import/net-new-verified.json
          if-no-files-found: warn
          retention-days: 30
