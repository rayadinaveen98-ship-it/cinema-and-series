name: Indian Film Language — Verified Source Reconciliation (Read Only)
on:
  push:
    branches: ["feature/p2-indian-film-language-evidence-v1"]
    paths:
      - ".github/workflows/india-film-language-reconciliation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate strict language reconciliation and SQL idempotence
        run: python -m unittest tests.test_reconcile_india_film_languages tests.test_india_film_language_evidence -v

      - name: Restore immutable source-only language checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/india-film-language-v1
          git fetch --no-tags origin c352657c5113f3126c50e02ad0c4a71f8e2e8c21
          git show c352657c5113f3126c50e02ad0c4a71f8e2e8c21:.automation/india-language-evidence.json \
            > data/generated/india-film-language-v1/source-checkpoint.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("data/generated/india-film-language-v1/source-checkpoint.json")
          data=json.loads(path.read_text())
          assert data["schema"]=="india-film-language-evidence-v1" and len(data["records"])>=100
          print("SOURCE_CHECKPOINT_QIDS="+str(len(data["records"])),flush=True)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Connect existing D1, no migrations or writes
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Read unknown-language Indian film identities from production
        shell: bash
        run: |
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,release_year,language_name,country_code FROM catalogue_titles WHERE country_code='IN' AND wikidata_qid IS NOT NULL AND (language_name IS NULL OR LOWER(TRIM(language_name)) IN ('','unknown','xx','und','n/a','na','none','null'));" \
            > data/generated/india-film-language-v1/unknown-films.json

      - name: Reconcile without applying changes
        shell: bash
        run: |
          python scripts/reconcile_india_film_languages.py \
            --checkpoint data/generated/india-film-language-v1/source-checkpoint.json \
            --production-snapshot data/generated/india-film-language-v1/unknown-films.json \
            --out-dir data/generated/india-film-language-v1/proposals \
            --max-updates 1000
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/generated/india-film-language-v1/proposals")
          report=json.loads((root/"reconciliation.json").read_text())
          qids=[row["qid"] for row in report["selected"]]
          assert len(qids)==len(set(qids)) and len(qids)<=1000
          assert report["production_writes"]==0
          print("INDIA_FILM_LANGUAGE_DRY_RUN="+json.dumps({
             "source_records":report["source_records"],
             "unknown_production_rows":report["production_snapshot_rows"],
             "proposals":report["selected_count"],
             "rejects":report["rejected_reasons"],"d1_writes":0
          },sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-film-language-p364-v1-dry-run
          path: |
            data/generated/india-film-language-v1/proposals/reconciliation.json
            data/generated/india-film-language-v1/proposals/language-*.sql
          retention-days: 30
          if-no-files-found: warn
