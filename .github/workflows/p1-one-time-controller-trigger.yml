name: P1 One-Time Controller Trigger

# Temporary operator bridge for environments that cannot invoke workflow_dispatch directly.
# This workflow performs no D1 mutation itself. It only dispatches the already-reviewed
# P1 Quota-Safe Daily Resume controller, which owns all artifact, state, quota and write gates.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-one-time-controller-trigger.yml"

concurrency:
  group: p1-one-time-controller-trigger
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch-reviewed-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch quota-safe P1 controller
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run p1-quota-safe-daily-resume.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f apply_production_write=true
          echo "Dispatched the reviewed P1 quota-safe controller. This bridge performs no D1 mutation itself."
