name: Indian Films — Bulk D1 Reconcile and Guarded Import

on:
  # The first +10K growth milestone is complete. Pause autonomous production
  # imports until the next audited milestone has a new explicit target.
  workflow_dispatch:
    inputs:
      apply_to_production:
        description: "Explicitly apply guarded SQL to existing D1 (default previews only)"
        type: boolean
        required: false
        default: false
      max_titles:
        description: "Maximum fresh Indian film identities per run (1–10000)"
        required: true
        default: "4000"

# Serialize against the existing catalogue autopilot's D1 import process.
concurrency:
  group: india-catalogue-autopilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guarded-bulk-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAX_TITLES: ${{ inputs.max_titles || '4000' }}
      EXPLICIT_APPLY: ${{ inputs.apply_to_production || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test the bulk importer and non-destructive indexed SQL guards
        shell: bash
        run: |
          python -m unittest tests.test_wikidata_bulk_stage \
            tests.test_wikidata_bulk_execute \
            tests.test_india_category_import -v

      - name: Restore completed Wikidata source stage (never recreate source records)
        shell: bash
        run: |
          mkdir -p data/generated/wikidata-import
          git fetch --no-tags origin refs/heads/automation/wikidata-bulk-stage
          git show FETCH_HEAD:.automation/wikidata-bulk-stage.sqlite \
            > data/generated/wikidata-import/stage.sqlite
          test -s data/generated/wikidata-import/stage.sqlite

      - name: Connect only to the existing Cloudflare production database
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Fetch fresh production identities after D1 quota reset
        shell: bash
        run: |
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,release_date FROM movies;" \
            > data/generated/wikidata-import/exact.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,wikipedia_page_id,title,release_year,source_category FROM catalogue_titles;" \
            > data/generated/wikidata-import/year.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT wikidata_qid,title,first_air_year FROM series_titles;" \
            > data/generated/wikidata-import/series.json

      - name: Reconcile the shared 10K growth limit with the daily importer
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/automation/india-growth-state
          git show FETCH_HEAD:.automation/india-growth-state.json \
            > data/generated/wikidata-import/daily-state.json
          python scripts/india_bulk_target.py \
            --year-movies data/generated/wikidata-import/year.json \
            --autopilot-state data/generated/wikidata-import/daily-state.json \
            --max-requested "$MAX_TITLES" \
            --out-env "$GITHUB_ENV" \
            --out-json data/generated/wikidata-import/goal-progress.json

      - name: Reconcile staged CC0 Wikidata claims, create safe SQL preview
        shell: bash
        run: |
          python scripts/wikidata_bulk_import_sql.py \
            --stage data/generated/wikidata-import/stage.sqlite \
            --exact-movies data/generated/wikidata-import/exact.json \
            --year-movies data/generated/wikidata-import/year.json \
            --series data/generated/wikidata-import/series.json \
            --max-preview "$BULK_ALLOWED_NOW" \
            --out-dir data/generated/wikidata-import/prepared

      - name: Preview by default; automatically apply only on scheduled import windows
        shell: bash
        run: |
          FLAGS=()
          # Only an explicitly approved manual dispatch may write production.
          if [[ "$EXPLICIT_APPLY" == "true" ]]; then
            FLAGS+=(--apply)
          fi
          python scripts/wikidata_bulk_execute.py \
            --selected data/generated/wikidata-import/prepared/selected.json \
            --sql-dir data/generated/wikidata-import/prepared \
            --out-json data/generated/wikidata-import/import-result.json \
            --max-row-reads 1200000 \
            "${FLAGS[@]}"

      - name: Publish honest added-versus-submitted report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path("data/generated/wikidata-import")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fh:
              fh.write("## Wikidata bulk Indian film import\n\n")
              for name in ("prepared/reconciliation.json","import-result.json"):
                  path=root/name
                  if not path.is_file():
                      continue
                  fh.write(f"### {name}\n\n")
                  report=json.loads(path.read_text())
                  for key,val in report.items():
                      if key in {"sql_files"}:
                          continue
                      fh.write(f"- {key.replace('_',' ')}: **{val}**\n")
                  fh.write("\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-wikidata-bulk-reconciliation-and-import-result
          path: |
            data/generated/wikidata-import/goal-progress.json
            data/generated/wikidata-import/prepared/reconciliation.json
            data/generated/wikidata-import/prepared/selected.json
            data/generated/wikidata-import/import-result.json
          if-no-files-found: warn
          retention-days: 30
