name: P2 Artwork Coverage Audit

on:
  workflow_dispatch:
    inputs:
      territory:
        description: "Audit territory"
        required: true
        default: "IN"
      evaluated_at:
        description: "UTC RFC3339 evaluation time; blank uses current UTC"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TERRITORY: ${{ inputs.territory }}
      EVALUATED_AT_INPUT: ${{ inputs.evaluated_at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Export exact Movie identities and legacy artwork evidence
        run: |
          mkdir -p audit-output
          npx wrangler d1 execute cinema-and-series --remote --json             --command "SELECT id, language_name, country_code, poster_url, backdrop_url, artwork_source, artwork_source_url FROM movies WHERE wikidata_qid IS NULL OR title <> wikidata_qid ORDER BY id ASC"             > audit-output/movies.json

      - name: Export exact Series identities
        run: |
          npx wrangler d1 execute cinema-and-series --remote --json             --command "SELECT id, language_name, country_code FROM series_titles ORDER BY id ASC"             > audit-output/series.json

      - name: Normalize and audit snapshot
        shell: bash
        run: |
          if [[ -z "$EVALUATED_AT_INPUT" ]]; then
            EVALUATED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          else
            EVALUATED_AT="$EVALUATED_AT_INPUT"
          fi
          python scripts/build_p2_production_artwork_snapshot.py             --movies audit-output/movies.json             --series audit-output/series.json             --territory "$TERRITORY"             --evaluated-at "$EVALUATED_AT"             --output-dir audit-output

      - name: Upload immutable read-only audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2-artwork-coverage-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
