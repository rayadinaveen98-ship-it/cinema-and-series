name: P1 Run Today Once

# One-time guarded dispatch refreshed for the 2026-09-21 UTC quota day.
# This workflow never writes D1 directly; the quota-safe controller owns the daily guard.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-run-today-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Reassert P1 catalogue freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run p1-background-write-coordinator.yml --repo "$GITHUB_REPOSITORY" --ref main -f force_pause=true
      - name: Dispatch today's quota-safe P1 resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run p1-quota-safe-daily-resume.yml --repo "$GITHUB_REPOSITORY" --ref main -f apply_production_write=true
