name: Official Website Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-monitor.yml"
      - "scripts/website_monitor.py"
      - "scripts/website_monitor_runner.py"
      - "scripts/filter_website_candidates.py"
      - "scripts/observation_sql.py"
      - "scripts/release_identity.py"
      - "scripts/cloudflare_bootstrap.py"
      - "data/official/source_registry.json"
      - "data/official/website_monitor_config.json"
      - "data/official/releases.json"
      - "migrations/**"
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: official-website-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Poll first-party studio websites
        run: python scripts/website_monitor_runner.py

      - name: Suppress already verified website signals
        run: python scripts/filter_website_candidates.py

      - name: Validate website candidate payload
        run: python -m json.tool data/generated/website-release-candidates.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: official-website-release-candidates
          path: data/generated/website-release-candidates.json
          retention-days: 14

      - name: Check Cloudflare connection
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials unavailable; website candidate artifact kept but D1 queue sync skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Bind D1
        if: steps.cloudflare.outputs.ready == 'true'
        run: python scripts/cloudflare_bootstrap.py

      - name: Respect P1 UTC-day D1 write reservation
        if: steps.cloudflare.outputs.ready == 'true'
        id: p1_quota
        shell: bash
        run: |
          set -euo pipefail
          UTC_DATE="$(date -u +%F)"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS count FROM recommendation_materialization_daily_guard WHERE utc_date='${UTC_DATE}';" \
            > /tmp/p1-daily-guard.json
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/p1-daily-guard.json', encoding='utf-8'))
          rows=[]
          for batch in payload if isinstance(payload,list) else [payload]:
              if isinstance(batch,dict): rows.extend(batch.get('results') or [])
          if len(rows)!=1: raise SystemExit(f'unexpected P1 daily guard response: {len(rows)} rows')
          reserved=int(rows[0].get('count') or 0)>0
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"reserved={'true' if reserved else 'false'}\n")
          if reserved:
              print('P1_D1_WRITE_QUOTA_RESERVED: keeping website evidence artifact; D1 migration/sync skipped today')
          else:
              print('P1_D1_WRITE_QUOTA_AVAILABLE_FOR_BACKGROUND_SYNC')
          PY

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true' && steps.p1_quota.outputs.reserved != 'true'
        run: npx wrangler d1 migrations apply cinema-and-series --remote

      - name: Sync website review candidates to D1
        if: steps.cloudflare.outputs.ready == 'true' && steps.p1_quota.outputs.reserved != 'true'
        shell: bash
        run: |
          if [[ -s data/generated/website-candidates-upsert.sql ]]; then
            npx wrangler d1 execute cinema-and-series --remote --file=data/generated/website-candidates-upsert.sql
          else
            echo "No new release-date candidates detected on monitored first-party websites."
          fi
