name: India Movies — One-Time 1000-Title Guarded Import

on:
  push:
    branches: ["ops/india-next-milestone-1000-title-20261019"]
    paths:
      - ".github/workflows/india-next-milestone-1000-import-20261019.yml"

permissions:
  contents: read

# Share the production import lock with existing import workflows.
concurrency:
  group: india-catalogue-autopilot
  cancel-in-progress: false

jobs:
  guarded-pilot:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test reconciliation, QID uniqueness and insert-only SQL protection
        run: |
          python -m unittest tests.test_wikidata_bulk_execute tests.test_wikidata_bulk_stage tests.test_india_category_import -v

      - name: Restore existing Wikidata evidence checkpoint (no new claims fabricated)
        shell: bash
        run: |
          mkdir -p data/generated/india-recovery-1000
          git fetch --no-tags origin refs/heads/automation/wikidata-bulk-stage
          git show FETCH_HEAD:.automation/wikidata-bulk-stage.sqlite > data/generated/india-recovery-1000/stage.sqlite
          test -s data/generated/india-recovery-1000/stage.sqlite

      - name: Connect only to existing Cloudflare D1 (do not migrate or recreate)
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py

      - name: Capture fresh production identities and exact pre-import count
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/india-recovery-1000
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,release_date FROM movies;" > "$ROOT/exact.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,wikipedia_page_id,title,release_year,source_category FROM catalogue_titles;" > "$ROOT/year.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT wikidata_qid,title,first_air_year FROM series_titles;" > "$ROOT/series.json"
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS count FROM catalogue_titles;" > "$ROOT/before.json"

      - name: Reconcile and prepare at most 1000 source-backed films
        shell: bash
        run: |
          ROOT=data/generated/india-recovery-1000
          python scripts/wikidata_bulk_import_sql.py \
            --stage "$ROOT/stage.sqlite" \
            --exact-movies "$ROOT/exact.json" \
            --year-movies "$ROOT/year.json" \
            --series "$ROOT/series.json" \
            --max-preview 1000 \
            --out-dir "$ROOT/prepared"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/generated/india-recovery-1000/prepared")
          report=json.loads((root/"reconciliation.json").read_text())
          selected=json.loads((root/"selected.json").read_text())
          assert report["sql_preview_rows"]==len(selected) and len(selected)<=1000, "Unsafe pilot batch size"
          assert len({r["qid"] for r in selected})==len(selected), "Duplicate QID"
          assert all(1913<=r["year"]<=2026 and r["title"].strip() and r["title"]!=r["qid"] for r in selected), "Invalid identity"
          print("PILOT_RECONCILIATION="+json.dumps(report,sort_keys=True))
          print("PILOT_SELECTION_SAMPLE="+json.dumps([{"qid":r["qid"],"title":r["title"],"year":r["year"]} for r in selected[:12]],ensure_ascii=False))
          PY

      - name: Apply one capped insert-only batch and verify QID presence
        shell: bash
        run: |
          ROOT=data/generated/india-recovery-1000
          python scripts/wikidata_bulk_execute.py \
            --selected "$ROOT/prepared/selected.json" \
            --sql-dir "$ROOT/prepared" \
            --out-json "$ROOT/import-result.json" \
            --max-row-reads 250000 \
            --apply

      - name: Compare before/after year-catalogue totals
        shell: bash
        run: |
          ROOT=data/generated/india-recovery-1000
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT COUNT(*) AS count FROM catalogue_titles;" > "$ROOT/after.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/generated/india-recovery-1000")
          def count(name):
            r=json.loads((root/name).read_text())
            return int(r[0]["results"][0]["count"])
          a,b=count("before.json"),count("after.json")
          result=json.loads((root/"import-result.json").read_text())
          n=int(result.get("submitted_to_d1",0))
          delta=b-a
          report={"catalogue_titles_before":a,"catalogue_titles_after":b,
                  "new_year_precision_titles":delta,"submitted":n,
                  "verified_present_qids":result.get("verified_present_qids",0),
                  "import_status":result.get("status"),"utc_date":"2026-10-19"}
          (root/"verified-delta.json").write_text(json.dumps(report,indent=2)+"\n")
          print("INDIA_NEXT_MILESTONE_1000_RESULT="+json.dumps(report,sort_keys=True))
          if not 0<=delta<=1000 or delta>n:
            raise SystemExit("Unsafe import count mismatch")
          if result.get("status") not in ("completed","read_budget_paused"):
            raise SystemExit("Import did not complete safely")
          PY

      - name: Publish before/after and provenance for audit
        if: always()
        shell: bash
        run: |
          ROOT=data/generated/india-recovery-1000
          {
            echo "## India cinema next-milestone 1000-title bounded recovery import"
            echo ""
            echo "Source: staged Wikidata P31 film, P495 India, P577 year; not official release-date verification."
            echo ""
            if [[ -f "$ROOT/verified-delta.json" ]]; then
              echo '~~~json'
              cat "$ROOT/verified-delta.json"
              echo '~~~'
            elif [[ -f "$ROOT/prepared/reconciliation.json" ]]; then
              echo "Pre-import reconciliation completed; import verification unavailable."
            else
              echo "No verified production import."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-next-milestone-1000-title-import-20261019
          path: |
            data/generated/india-recovery-1000/prepared/reconciliation.json
            data/generated/india-recovery-1000/prepared/selected.json
            data/generated/india-recovery-1000/import-result.json
            data/generated/india-recovery-1000/verified-delta.json
          retention-days: 30
          if-no-files-found: ignore
