name: Existing Titles — Artwork Pilot (Read Only)

# One off: scheduled after October 20, 2026 database quota reset/recovery.
# Exact existing title identities only; never imports titles or publishes images.
on:
  schedule:
    - cron: "10 3 20 10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinema-existing-artwork-pilot
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Guard scheduled date (manual dispatch allowed)
        id: guard
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(date -u +%F)" == "2026-10-20" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "One-time schedule expired; no D1 reads."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.allowed == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.allowed == 'true'
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.allowed == 'true'
        with: {node-version: "22"}
      - name: Verify source-only pilot test suite
        if: steps.guard.outputs.allowed == 'true'
        run: python -m unittest tests.test_existing_title_artwork_pilot tests.test_existing_artwork_review_gallery -v
      - name: Bind existing D1 (no create, migration or data changes)
        if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-audit --no-fund
          python scripts/cloudflare_bootstrap.py
          mkdir -p data/generated/artwork-pilot
      - name: Read bounded samples of exact existing identities (NO D1 WRITES)
        if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/artwork-pilot
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT m.id,m.wikidata_qid,m.title,
              CAST(substr(m.release_date,1,4) AS INTEGER) AS year,
              m.language_name,m.country_code,0 AS has_poster
            FROM movies m
            WHERE m.wikidata_qid GLOB 'Q[0-9]*'
              AND m.title <> m.wikidata_qid
              AND COALESCE(TRIM(m.poster_url),'') = ''
              AND NOT EXISTS (SELECT 1 FROM title_artwork_links l
                WHERE l.source_table='movies' AND l.source_id=m.id AND l.presentation_role='poster')
            ORDER BY CASE WHEN m.country_code='IN' THEN 0 ELSE 1 END,
              m.release_date DESC,m.title COLLATE NOCASE
            LIMIT 120;" > "$ROOT/movies.json"
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT c.id,c.wikidata_qid,c.title,c.release_year AS year,
              c.language_name,c.country_code,0 AS has_poster
            FROM catalogue_titles c
            WHERE c.wikidata_qid GLOB 'Q[0-9]*'
              AND NOT EXISTS (SELECT 1 FROM movies m WHERE m.wikidata_qid=c.wikidata_qid
                AND m.title <> m.wikidata_qid)
              AND NOT EXISTS (SELECT 1 FROM title_artwork_links l
                WHERE l.source_table='catalogue_titles' AND l.source_id=c.id AND l.presentation_role='poster')
            ORDER BY CASE WHEN c.country_code='IN' THEN 0 ELSE 1 END,
              c.release_year DESC,c.title COLLATE NOCASE
            LIMIT 180;" > "$ROOT/catalogue_titles.json"
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT s.id,s.wikidata_qid,s.title,s.first_air_year AS year,
              s.language_name,s.country_code,0 AS has_poster
            FROM series_titles s
            WHERE s.wikidata_qid GLOB 'Q[0-9]*'
              AND NOT EXISTS (SELECT 1 FROM title_artwork_links l
                WHERE l.source_table='series_titles' AND l.source_id=s.id AND l.presentation_role='poster')
            ORDER BY CASE WHEN s.country_code='IN' THEN 0 ELSE 1 END,
              COALESCE(s.first_air_year,0) DESC,s.title COLLATE NOCASE
            LIMIT 45;" > "$ROOT/series_titles.json"
      - name: Count existing stored poster references (NO D1 WRITES)
        if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: |
          npx wrangler d1 execute cinema-and-series --remote --json --command "
            SELECT 'movies' AS source_table,COUNT(*) AS titles,
             SUM(CASE WHEN COALESCE(TRIM(m.poster_url),'') <> '' OR EXISTS(
               SELECT 1 FROM title_artwork_links l WHERE l.source_table='movies'
                 AND l.source_id=m.id AND l.presentation_role='poster'
             ) THEN 1 ELSE 0 END) AS with_poster_reference FROM movies m
            UNION ALL SELECT 'catalogue_titles',COUNT(*),SUM(CASE WHEN EXISTS(
               SELECT 1 FROM title_artwork_links l WHERE l.source_table='catalogue_titles'
                 AND l.source_id=c.id AND l.presentation_role='poster'
             ) THEN 1 ELSE 0 END) FROM catalogue_titles c
            UNION ALL SELECT 'series_titles',COUNT(*),SUM(CASE WHEN EXISTS(
               SELECT 1 FROM title_artwork_links l WHERE l.source_table='series_titles'
                 AND l.source_id=s.id AND l.presentation_role='poster'
             ) THEN 1 ELSE 0 END) FROM series_titles s;" \
            > data/generated/artwork-pilot/coverage-raw.json
      - name: Discover Wikidata P18 / Commons artwork only for the exact selected QIDs
        if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=data/generated/artwork-pilot
          python scripts/existing_title_artwork_pilot.py \
            --movies "$ROOT/movies.json" \
            --catalogue-titles "$ROOT/catalogue_titles.json" \
            --series-titles "$ROOT/series_titles.json" \
            --limit 100 --output "$ROOT/candidates.json"
          python scripts/render_existing_artwork_review.py \
            --input "$ROOT/candidates.json" \
            --html "$ROOT/artwork-review-gallery.html" \
            --csv "$ROOT/artwork-review-decisions.csv"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("data/generated/artwork-pilot")
          pilot=json.loads((root/"candidates.json").read_text())
          rows=[r for b in json.loads((root/"coverage-raw.json").read_text()) for r in b.get("results",[])]
          if not pilot["read_only"] or pilot["publication_performed"] or pilot["d1_writes"]:
              raise SystemExit("Artwork publication/writes forbidden")
          if pilot["selected_count"]!=len(pilot["candidates"]) or pilot["selected_count"]>100:
              raise SystemExit("Pilot identity count invalid")
          report={"schema":"existing-artwork-coverage-v1","source":"live existing D1 read-only",
                  "note":"Stored poster references are not proof of image loading or rights approval.",
                  "d1_writes":0,"coverage_by_table":rows,"pilot_count":pilot["selected_count"],
                  "review_statuses":pilot["status_counts"]}
          (root/"coverage-report.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Existing catalogue artwork — zero writes\n\n")
              f.write("| Table | Records | Stored poster refs |\n|---|---:|---:|\n")
              for r in rows:
                  f.write(f"| {r['source_table']} | {r['titles']:,} | {int(r.get('with_poster_reference') or 0):,} |\n")
              f.write(f"\nPilot titles: **{pilot['selected_count']}**. Source images require review.\n\n")
              for k,v in pilot["status_counts"].items():
                  f.write(f"- {k}: {v}\n")
          PY
      - name: Archive proof and visual rights review leads
        if: always() && steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinema-existing-100-artwork-review
          path: |
            data/generated/artwork-pilot/candidates.json
            data/generated/artwork-pilot/coverage-report.json
            data/generated/artwork-pilot/artwork-review-gallery.html
            data/generated/artwork-pilot/artwork-review-decisions.csv
          if-no-files-found: warn
          retention-days: 30
