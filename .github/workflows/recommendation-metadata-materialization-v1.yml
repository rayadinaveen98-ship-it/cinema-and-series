name: Recommendation Metadata Materialization V1

on:
  workflow_dispatch:

concurrency:
  group: recommendation-metadata-materialization-v1-analysis
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHARD_COUNT: "8"
  MAX_TITLES_PER_SHARD: "2000"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run P1 materializer tests
        run: |
          python -m unittest tests.test_recommendation_metadata_audit tests.test_recommendation_metadata_enrichment -v
          python -m unittest tests.test_recommendation_projection_manifest -v

      - name: Check Cloudflare connection
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare credentials are required for the read-only production snapshot."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Bind production D1
        run: python scripts/cloudflare_bootstrap.py

      - name: Capture stable QID-backed catalogue snapshots
        shell: bash
        run: |
          mkdir -p data/generated
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title FROM movies WHERE wikidata_qid IS NOT NULL AND trim(wikidata_qid) <> '' ORDER BY id;" \
            > data/generated/recommendation-movies.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,source_url FROM catalogue_titles WHERE wikidata_qid IS NOT NULL AND trim(wikidata_qid) <> '' ORDER BY id;" \
            > data/generated/recommendation-catalogue.json
          npx wrangler d1 execute cinema-and-series --remote --json \
            --command "SELECT id,wikidata_qid,title,source_url FROM series_titles WHERE wikidata_qid IS NOT NULL AND trim(wikidata_qid) <> '' ORDER BY id;" \
            > data/generated/recommendation-series.json

      - name: Build immutable catalogue projection manifest
        run: |
          python scripts/recommendation_projection_manifest.py \
            --movies data/generated/recommendation-movies.json \
            --catalogue data/generated/recommendation-catalogue.json \
            --series data/generated/recommendation-series.json \
            --out-json data/generated/recommendation-projection-manifest.json

      - name: Validate materialization projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.recommendation_metadata_audit import load_d1_rows, build_catalogue_projection
          from scripts.recommendation_projection_manifest import fingerprint

          projection = build_catalogue_projection(
              load_d1_rows("data/generated/recommendation-movies.json"),
              load_d1_rows("data/generated/recommendation-catalogue.json"),
              load_d1_rows("data/generated/recommendation-series.json"),
          )
          manifest = json.loads(Path("data/generated/recommendation-projection-manifest.json").read_text())
          collisions = projection["cross_type_collision_qids"]
          candidates = projection["candidates"]
          if collisions:
              raise SystemExit(f"cross-type Wikidata identity collision detected: {collisions[:20]}")
          if not candidates:
              raise SystemExit("no QID-backed recommendation candidates available")
          if manifest.get("schema_version") != "recommendation-projection-manifest-v1":
              raise SystemExit("unexpected projection manifest schema")
          if fingerprint(manifest.get("entries") or []) != manifest.get("sha256"):
              raise SystemExit("projection manifest fingerprint is internally inconsistent")
          if manifest.get("candidate_count") != len(candidates):
              raise SystemExit("projection manifest candidate count mismatch")
          if manifest.get("movie_qid_count") != projection["movie_qid_count"]:
              raise SystemExit("projection manifest movie count mismatch")
          if manifest.get("series_qid_count") != projection["series_qid_count"]:
              raise SystemExit("projection manifest series count mismatch")
          print("RECOMMENDATION_MATERIALIZATION_PROJECTION=" + json.dumps({
              "candidate_count": len(candidates),
              "movie_qid_count": projection["movie_qid_count"],
              "series_qid_count": projection["series_qid_count"],
              "sha256": manifest["sha256"],
          }, sort_keys=True))
          PY

      - name: Preserve stable production snapshots
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-metadata-materialization-v1-snapshots
          path: |
            data/generated/recommendation-movies.json
            data/generated/recommendation-catalogue.json
            data/generated/recommendation-series.json
            data/generated/recommendation-projection-manifest.json
          if-no-files-found: error
          retention-days: 30

  materialize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore stable production snapshots
        uses: actions/download-artifact@v4
        with:
          name: recommendation-metadata-materialization-v1-snapshots
          path: data/generated

      - name: Resolve and materialize explicit recommendation metadata
        run: |
          python scripts/enrich_recommendation_metadata.py \
            --movies data/generated/recommendation-movies.json \
            --catalogue data/generated/recommendation-catalogue.json \
            --series data/generated/recommendation-series.json \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${SHARD_COUNT}" \
            --max-titles "${MAX_TITLES_PER_SHARD}" \
            --out-json "data/generated/recommendation-materialization-shard-${{ matrix.shard }}.json" \
            --out-sql "data/generated/recommendation-materialization-shard-${{ matrix.shard }}.sql"

      - name: Bind shard evidence to immutable projection
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.recommendation_projection_manifest import fingerprint

          shard = os.environ["SHARD_INDEX"]
          report_path = Path(f"data/generated/recommendation-materialization-shard-{shard}.json")
          sql_path = Path(f"data/generated/recommendation-materialization-shard-{shard}.sql")
          manifest = json.loads(Path("data/generated/recommendation-projection-manifest.json").read_text())
          report = json.loads(report_path.read_text())

          if fingerprint(manifest.get("entries") or []) != manifest.get("sha256"):
              raise SystemExit("projection manifest fingerprint is internally inconsistent")

          projection = report.get("projection") or {}
          if int(projection.get("movie_qid_count") or 0) != int(manifest.get("movie_qid_count") or 0):
              raise SystemExit("materialization movie projection does not match manifest")
          if int(projection.get("series_qid_count") or 0) != int(manifest.get("series_qid_count") or 0):
              raise SystemExit("materialization series projection does not match manifest")

          bound_manifest = {
              "schema_version": manifest["schema_version"],
              "candidate_count": manifest["candidate_count"],
              "movie_qid_count": manifest["movie_qid_count"],
              "series_qid_count": manifest["series_qid_count"],
              "sha256": manifest["sha256"],
          }
          report["projection_manifest"] = bound_manifest
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")

          sql = sql_path.read_text()
          fingerprint_comment = f"-- Projection manifest SHA-256: {manifest['sha256']}\n"
          candidate_comment = f"-- Projection candidate count: {manifest['candidate_count']}\n"
          if fingerprint_comment not in sql:
              sql = fingerprint_comment + candidate_comment + sql
          sql_path.write_text(sql)
          print("P1_MATERIALIZATION_BOUND=" + json.dumps({"shard": shard, **bound_manifest}, sort_keys=True))
          PY

      - name: Validate dry-run output
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          shard = os.environ["SHARD_INDEX"]
          report = json.loads(Path(f"data/generated/recommendation-materialization-shard-{shard}.json").read_text())
          manifest = json.loads(Path("data/generated/recommendation-projection-manifest.json").read_text())
          if report.get("production_mutation") is not False:
              raise SystemExit("materialization analysis must remain read-only")
          if report.get("schema_version") != "recommendation-metadata-foundation-v1-materialization":
              raise SystemExit("unexpected materialization schema version")
          bound = report.get("projection_manifest") or {}
          if bound.get("sha256") != manifest.get("sha256"):
              raise SystemExit("materialization report is not bound to the stable projection fingerprint")
          if int(bound.get("candidate_count") or 0) != int(manifest.get("candidate_count") or 0):
              raise SystemExit("materialization report projection count mismatch")
          candidates = int(report["stats"].get("candidate_titles") or 0)
          if candidates > int(os.environ["MAX_TITLES_PER_SHARD"]):
              raise SystemExit("materialization shard exceeded safety cap")
          emitted = int(report["stats"].get("emitted_genre_relations") or 0) + int(report["stats"].get("emitted_credit_relations") or 0)
          raw = int(report.get("raw_relation_count") or 0)
          if emitted > raw:
              raise SystemExit("emitted relationship count exceeds explicit source relationship count")
          sql = Path(f"data/generated/recommendation-materialization-shard-{shard}.sql").read_text()
          if "BEGIN;" not in sql or not sql.rstrip().endswith("COMMIT;"):
              raise SystemExit("generated SQL is not transaction-wrapped")
          if f"-- Projection manifest SHA-256: {manifest['sha256']}" not in sql:
              raise SystemExit("generated SQL is not bound to projection fingerprint")
          print("P1_MATERIALIZATION_SHARD_VALIDATED=" + json.dumps({
              "shard": shard,
              "candidates": candidates,
              "raw_relations": raw,
              "emitted_relations": emitted,
              "missing_label_relations": report["stats"].get("skipped_relations_missing_label", 0),
              "projection_sha256": manifest["sha256"],
          }, sort_keys=True))
          PY

      - name: Preserve shard materialization
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-metadata-materialization-v1-shard-${{ matrix.shard }}
          path: |
            data/generated/recommendation-materialization-shard-${{ matrix.shard }}.json
            data/generated/recommendation-materialization-shard-${{ matrix.shard }}.sql
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: recommendation-metadata-materialization-v1-shard-*
          path: materialization-shards
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: recommendation-metadata-materialization-v1-snapshots
          path: stable-snapshot

      - uses: actions/checkout@v4

      - name: Aggregate materialization evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.recommendation_projection_manifest import fingerprint

          reports = [json.loads(path.read_text()) for path in sorted(Path("materialization-shards").glob("*.json"))]
          if len(reports) != 8:
              raise SystemExit(f"expected 8 materialization reports, found {len(reports)}")

          manifest = json.loads(Path("stable-snapshot/recommendation-projection-manifest.json").read_text())
          if fingerprint(manifest.get("entries") or []) != manifest.get("sha256"):
              raise SystemExit("stable projection manifest fingerprint is internally inconsistent")
          bound_manifest = {
              "schema_version": manifest["schema_version"],
              "candidate_count": manifest["candidate_count"],
              "movie_qid_count": manifest["movie_qid_count"],
              "series_qid_count": manifest["series_qid_count"],
              "sha256": manifest["sha256"],
          }

          projection = reports[0]["projection"]
          for report in reports:
              if report["projection"] != projection:
                  raise SystemExit("projection metadata drifted between materialization shards")
              if report.get("production_mutation") is not False:
                  raise SystemExit("materialization evidence contains a production mutation")
              if report.get("projection_manifest") != bound_manifest:
                  raise SystemExit("materialization shard is not bound to the stable projection manifest")

          fields = (
              "candidate_titles",
              "missing_title_entities",
              "unusable_claims",
              "genre_relations",
              "director_relations",
              "creator_relations",
              "cast_relations",
              "resolved_genres",
              "resolved_people",
              "missing_label_entities",
              "skipped_relations_missing_label",
              "emitted_genre_relations",
              "emitted_credit_relations",
          )
          totals = {field: 0 for field in fields}
          for report in reports:
              for field in fields:
                  totals[field] += int(report["stats"].get(field) or 0)

          expected = int(projection["movie_qid_count"]) + int(projection["series_qid_count"])
          if totals["candidate_titles"] != expected:
              raise SystemExit(f"candidate partition mismatch: {totals['candidate_titles']} != {expected}")
          if totals["candidate_titles"] != int(manifest["candidate_count"]):
              raise SystemExit("materialization total does not match immutable projection manifest")

          explicit_relations = (
              totals["genre_relations"]
              + totals["director_relations"]
              + totals["creator_relations"]
              + totals["cast_relations"]
          )
          emitted_relations = totals["emitted_genre_relations"] + totals["emitted_credit_relations"]
          if emitted_relations + totals["skipped_relations_missing_label"] != explicit_relations:
              raise SystemExit("resolved + missing-label relations do not partition explicit relationships")

          summary = {
              "schema_version": "recommendation-metadata-materialization-v1-summary",
              "state": "complete",
              "production_mutation": False,
              "projection": projection,
              "projection_manifest": bound_manifest,
              "totals": totals,
              "explicit_relation_count": explicit_relations,
              "emitted_relation_count": emitted_relations,
          }
          Path("recommendation-metadata-materialization-v1-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print("RECOMMENDATION_METADATA_MATERIALIZATION_V1=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Preserve aggregate materialization report
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-metadata-materialization-v1-summary
          path: recommendation-metadata-materialization-v1-summary.json
          if-no-files-found: error
          retention-days: 30
